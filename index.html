<script>
{
/* ===== ProgLab · entrega à professora (comum a todas as plataformas) =====
   Sem servidor: gera um ficheiro .json que os alunos entregam (Classroom, Teams, pen).
   O código de turma e os prazos ficam guardados neste navegador e são partilhados
   por todas as páginas do mesmo site. */
const PL=(()=>{
  const ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',SK='proglab-turma-v1';
  const clean=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const chk=s=>{let t=0;for(let i=0;i<s.length;i++)t+=(ABC.indexOf(s[i])+1)*(i+3);return ABC[t%32]};
  const valid=c=>{const s=clean(c);return s.length===6&&[...s].every(x=>ABC.includes(x))&&chk(s.slice(0,5))===s[5]};
  const fmt=c=>{const s=clean(c);return s.length>3?s.slice(0,3)+'-'+s.slice(3):s};
  const cyrb=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')};
  const seal=(o,code)=>cyrb(JSON.stringify(o)+'|'+clean(code),0x50524f47);
  let st={code:'',prazos:{}};
  try{const r=JSON.parse(localStorage.getItem(SK)||'null');if(r)st={code:r.code||'',prazos:r.prazos||{}}}catch(e){}
  const keep=()=>{try{localStorage.setItem(SK,JSON.stringify(st))}catch(e){}};
  /* ligação da professora: ?turma=ABC-DEF&p=W5.2026-12-10~L5.2027-01-15 */

  const line=o=>{const d=document.createElement('div');if(o.c!==undefined){(o.p||[]).forEach(x=>{const s=document.createElement('span');s.className=x.c||'';s.textContent=x.t;d.append(s)});d.append(document.createTextNode(o.c))}else{d.textContent=o.o;if(o.e)d.className='er'}out.append(d)};
  const push=o=>{if(o.e&&!o.re)st.errs=(st.errs||0)+1;st.tx.push(o);if(st.tx.length>260)st.tx.splice(0,st.tx.length-260);line(o)};
  const prompt=()=>{pr.innerHTML='';if(queue){pr.textContent=queue[0]+' ';inp.type='password';return}inp.type='text';cfg.prompt().forEach(x=>{const s=document.createElement('span');s.className=x.c||'';s.textContent=x.t;pr.append(s)})};
  const ask=(labels,f)=>{queue=labels.slice();vals=[];cb=f};
  const emit=res=>{(res||[]).forEach(o=>{if(o&&o.clear){st.tx=[];out.innerHTML='';return}push(typeof o==='string'?{o}:{o:o.s,e:o.e})})};
  st.tx.forEach(line);if(!st.tx.length)push({o:cfg.welcome||'Escrevam help para ver os comandos disponíveis.'});prompt();
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const v=inp.value;inp.value='';hi=-1;
      if(queue){push({p:[{t:queue[0]+' '}],c:''});vals.push(v);queue.shift();if(!queue.length){queue=null;const f=cb;cb=null;emit(f(vals))}prompt();cfg.after&&cfg.after();el.scrollTop=el.scrollHeight;return}
      push({p:cfg.prompt(),c:v});if(v.trim()){st.hist.push(v);if(st.hist.length>150)st.hist.shift()}
      emit(cfg.run(v,ask));prompt();cfg.after&&cfg.after();save();el.scrollTop=el.scrollHeight}
    else if(e.key==='ArrowUp'&&!queue){if(!st.hist.length)return;e.preventDefault();hi=hi<0?st.hist.length-1:Math.max(0,hi-1);inp.value=st.hist[hi]}

  });

  requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight});

}

/* ===== estado das fases ===== */
function misState(id){const L=LABS[id],s=LS(id);return L.missions(T()).map(x=>{let ok=false;try{ok=!!x.ok(s.prac)}catch(e){}return{...x,done:ok}})}
function phaseDone(id,ph){const L=LABS[id],s=LS(id);if(ph==='aprender')return !!s.seen.aprender;if(ph==='praticar')return misState(id).filter(x=>!x.opt).every(x=>x.done);if(ph==='avaria'){let ok=false;try{ok=L.fixed(s.fault,T())}catch(e){}return ok&&words(s.diag).length>=25}if(ph==='verificar')return QUIZ[id].every((q,j)=>s.ans[j]===0);if(ph==='comparar')return words(s.refl).length>=40;return false}

  else{el.className='envbox bash';makeTerm(el,{store:m,welcome:`Ubuntu 24.04.3 LTS (simulado) · ${m.host} · equipa ${nn()}\nSessão: aluno (administrador, grupo sudo). Escrevam help.`,prompt:()=>{const u=lcur(m);const home=m.users[u]?.home||'/';const p=m.cwd===home?'~':m.cwd.startsWith(home+'/')?'~'+m.cwd.slice(home.length):m.cwd;return[{t:`${u}@${m.host}`,c:'pu'},{t:':'},{t:p,c:'pp'},{t:u==='root'?'# ':'$ '}]},run:(l,ask)=>lRun(m,l,ask),after})}}
function paintQuiz(id){const s=LS(id),Q=QUIZ[id];
  const ord=j=>{if(!s.ord[j]){const a=[...Array(Q[j][1].length).keys()];for(let k=a.length-1;k>0;k--){const x=Math.floor(Math.random()*(k+1));[a[k],a[x]]=[a[x],a[k]]}s.ord[j]=a}return s.ord[j]};
  $('#quiz').innerHTML=Q.map((q,j)=>`<fieldset><legend>${j+1}. ${esc(q[0])}</legend>${ord(j).map(k=>`<label class="opt"><input type="radio" name="q${j}" value="${k}"${s.ans[j]===k?' checked':''}><span>${esc(q[1][k])}</span></label>`).join('')}<p class="fb" id="fb${j}"></p></fieldset>`).join('');
  const fb=j=>{const p=$('#fb'+j),a=s.ans[j];if(!s.checked){p.textContent='';return}if(a===undefined){p.innerHTML='<span class="bad">Escolham uma opção.</span>';return}if(a===0){p.innerHTML=`<span class="good">Certo.</span> ${esc(Q[j][2])}`;return}p.innerHTML=`<span class="bad">Ainda não.</span> ${(s.att[j]||0)>=2?'Explicação: '+esc(Q[j][2]):'Revejam a fase Aprender e tentem outra vez.'}`};
  Q.forEach((q,j)=>{document.querySelectorAll(`input[name=q${j}]`).forEach(x=>x.onchange=()=>{s.ans[j]=+x.value;$('#fb'+j).textContent='';save()});fb(j)});
  $('#qcheck').onclick=()=>{s.checked=true;Q.forEach((q,j)=>{if(s.ans[j]!==undefined&&s.ans[j]!==0)s.att[j]=(s.att[j]||0)+1;fb(j)});const ok=Q.filter((q,j)=>s.ans[j]===0).length;$('#qres').textContent=`${ok} de ${Q.length} certas.`;save();refreshPhases(id)};
}

/* ===== Aprender: conteúdos e interativos ===== */
function learnW5(t){return `<div class="learn">
 <div class="lcard"><h3>Contas locais</h3><p>Cada pessoa tem a sua conta. Assim, cada uma tem os seus ficheiros e as suas definições, e o sistema regista quem fez o quê.</p><div class="scroll"><table><thead><tr><th>Tipo</th><th>O que pode fazer</th><th>Quando usar</th></tr></thead><tbody><tr><td><b>Administrador</b></td><td>Instalar programas, criar contas, alterar permissões e definições do sistema</td><td>Só para quem gere o PC (aqui: ${esc(t.u[0])})</td></tr><tr><td><b>Padrão</b></td><td>Usar programas e gerir os próprios ficheiros</td><td>Trabalho do dia a dia</td></tr><tr><td><b>Convidado</b></td><td>Acesso muito limitado, sem palavra-passe</td><td>Vem desativada; deve continuar assim</td></tr></tbody></table></div></div>
 <div class="lcard"><h3>Grupos</h3><p>As permissões dão-se a <b>grupos</b>, não a pessoas. Quando alguém entra para a ${esc(t.lA.toLowerCase())}, basta juntá-lo ao grupo ${esc(t.gA)}, sem mexer nas pastas.</p><p>Grupos incorporados: <b>Administradores</b> (controlo total do PC), <b>Utilizadores</b> (todas as contas criadas entram aqui) e <b>Convidados</b>.</p></div>
 <div class="lcard"><h3>UAC: Controlo de Conta de Utilizador</h3><p>Mesmo um administrador trabalha com privilégios normais. Quando uma ação precisa de mais, o Windows escurece o ecrã e pergunta:</p><ul><li><b>Administrador:</b> só tem de confirmar (Sim / Não).</li><li><b>Conta padrão:</b> tem de escrever o nome e a palavra-passe de um administrador.</li></ul></div>
 <div class="lcard"><h3>Permissões NTFS</h3><div class="scroll"><table><thead><tr><th>Permissão</th><th>Permite</th></tr></thead><tbody><tr><td>Controlo total</td><td>Tudo, incluindo alterar permissões e tomar posse</td></tr><tr><td>Modificar</td><td>Ler, criar, alterar e eliminar</td></tr><tr><td>Ler e executar</td><td>Abrir ficheiros e executar programas</td></tr><tr><td>Leitura</td><td>Ver o conteúdo</td></tr><tr><td>Escrita</td><td>Criar ficheiros e gravar alterações</td></tr></tbody></table></div><ul><li><b>Herança:</b> por omissão, uma subpasta recebe as permissões da pasta-mãe (aparecem a cinzento). Para as mudar, desativa-se a herança e convertem-se em explícitas.</li><li><b>Negar prevalece:</b> uma entrada «Negar» explícita ganha a qualquer «Permitir».</li><li><b>Permissões efetivas:</b> juntam-se as do utilizador e as de todos os seus grupos; depois retira-se o que estiver negado.</li></ul></div>
 <div class="lcard wide"><h3>Experimentem: permissões efetivas</h3><p class="small">Liguem e desliguem entradas da lista de controlo de acesso (ACL) da pasta ${esc(t.fA)} e vejam o que cada pessoa consegue fazer.</p><div class="calc"><div><b>Entradas da ACL</b>${[['adm','Administradores · Permitir · Controlo total',1],['ga',`${t.gA} · Permitir · Modificar`,1],['us','Utilizadores · Permitir · Ler e executar (herdada)',1],['dn',`${t.u[1]} · Negar · Escrita`,0]].map(([k,l,on])=>`<label class="chk"><input type="checkbox" data-ace="${k}"${on?' checked':''}> ${esc(l)}</label>`).join('')}</div><div><b>Resultado</b><div id="calcout"></div></div></div></div>
 </div>`}
function learnL5(t){return `<div class="learn">
 <div class="lcard"><h3>Contas no Ubuntu</h3><p>Cada utilizador é uma linha de <code>/etc/passwd</code>:</p><pre class="anat">${esc(t.u[1])}:x:1002:1002::/home/${esc(t.u[1])}:/bin/bash</pre><ul class="small"><li><b>${esc(t.u[1])}</b>: nome · <b>x</b>: a palavra-passe está em /etc/shadow</li><li><b>1002</b>: UID (número do utilizador) · <b>1002</b>: GID do grupo principal</li><li><b>/home/${esc(t.u[1])}</b>: diretório pessoal · <b>/bin/bash</b>: shell</li></ul><p>Os grupos estão em <code>/etc/group</code>. Um utilizador tem um grupo principal e pode ter grupos secundários.</p></div>
 <div class="lcard"><h3>root, sudo e su</h3><ul><li><b>root</b> (UID 0) pode tudo. No Ubuntu não se inicia sessão como root.</li><li><b>sudo comando</b> executa um comando como root, com a palavra-passe do próprio utilizador. Só funciona para quem está no grupo <b>sudo</b>.</li><li><b>su - nome</b> muda para outro utilizador, com a palavra-passe dele. Serve para testar permissões. <code>exit</code> volta atrás.</li></ul></div>
 <div class="lcard"><h3>Dono, grupo e outros</h3><pre class="anat">drwxrwx--- 2 root ${esc(t.gA)} 4096 ${esc(t.fA)}</pre><p>Cada ficheiro tem um <b>dono</b> e um <b>grupo</b>. As 9 letras são três blocos de rwx: dono, grupo e outros. O sistema usa o primeiro bloco que se aplica a quem pede acesso.</p><ul><li><code>chown dono:grupo pasta</code> e <code>chgrp grupo pasta</code> mudam o dono e o grupo.</li><li><code>chmod 770 pasta</code> ou <code>chmod g+rwx,o-rwx pasta</code> mudam as permissões.</li><li><b>setgid</b> (<code>chmod g+s</code>): os ficheiros novos herdam o grupo da pasta.</li><li><b>ACL</b> (<code>setfacl -m g:grupo:rx pasta</code>): dá permissões a mais grupos ou utilizadores, como no Windows.</li></ul></div>
 <div class="lcard"><h3>r, w e x não são iguais em pastas</h3><div class="scroll"><table><thead><tr><th></th><th>Num ficheiro</th><th>Numa pasta</th></tr></thead><tbody><tr><td><b>r</b> (4)</td><td>ler o conteúdo</td><td>listar os nomes (ls)</td></tr><tr><td><b>w</b> (2)</td><td>alterar o conteúdo</td><td>criar, apagar e mudar o nome de ficheiros</td></tr><tr><td><b>x</b> (1)</td><td>executar como programa</td><td>entrar (cd) e aceder aos ficheiros</td></tr></tbody></table></div></div>
 <div class="lcard wide"><h3>Experimentem: calculadora de permissões</h3><div class="calc"><div><table class="rwx"><thead><tr><th></th><th>r</th><th>w</th><th>x</th></tr></thead><tbody>${['Dono','Grupo','Outros'].map((w,i)=>`<tr><td>${w}</td>${[4,2,1].map(b=>`<td><input type="checkbox" data-rwx="${i}-${b}" aria-label="${w} ${b===4?'r':b===2?'w':'x'}"></td>`).join('')}</tr>`).join('')}</tbody></table><label class="chk"><input type="checkbox" id="sgid"> setgid (g+s)</label><label>Octal<input id="oct" value="0770" inputmode="numeric" style="width:7em"></label></div><div><b>Resultado</b><div id="rwxout"></div></div></div></div>
 </div>`}
function bindLearn(id){const t=T();
  if(id==='w5'){const calc=()=>{const on=k=>$(`[data-ace="${k}"]`).checked;const ppl=[[t.u[0],[t.gA,'Utilizadores','Administradores']],[t.u[1],[t.gA,'Utilizadores']],[t.u[2],[t.gB,'Utilizadores']]];const rows=ppl.map(([u,gs])=>{let al='',de='';if(on('adm')&&gs.includes('Administradores'))al+='rxwdp';if(on('ga')&&gs.includes(t.gA))al+='rxwd';if(on('us'))al+='rx';if(on('dn')&&u===t.u[1])de+='w';const r=new Set([...al].filter(c=>!de.includes(c)));const f=(c,l)=>`<span class="${r.has(c)?'good':'bad'}">${r.has(c)?'✓':'✗'} ${l}</span>`;return `<div class="pres"><b>${esc(u)}</b> <span class="small">(${gs.join(', ')})</span><div>${f('r','Ler')} ${f('w','Escrever')} ${f('d','Eliminar')} ${f('p','Alterar permissões')}</div></div>`}).join('');$('#calcout').innerHTML=rows+`<p class="small">${on('us')?`Com «Utilizadores» ativo, até ${esc(t.u[2])} consegue ler a pasta: é por isso que se desativa a herança e se remove esse grupo.`:`Sem «Utilizadores», só quem tem entradas próprias acede.`}${on('dn')?` O Negar retira a escrita a ${esc(t.u[1])}, apesar do grupo ter Modificar.`:''}</p>`};document.querySelectorAll('[data-ace]').forEach(x=>x.onchange=calc);calc()}
  if(id==='l5'){const boxes=[...document.querySelectorAll('[data-rwx]')];const from=v=>{const d=v.padStart(4,'0').split('').map(Number);$('#sgid').checked=!!(d[0]&2);boxes.forEach(b=>{const[i,bit]=b.dataset.rwx.split('-').map(Number);b.checked=!!(d[i+1]&bit)})};
    const show=()=>{const d=[0,1,2].map(i=>boxes.filter(b=>b.dataset.rwx.startsWith(i+'-')&&b.checked).reduce((s,b)=>s+Number(b.dataset.rwx.split('-')[1]),0));const sp=$('#sgid').checked?2:0;$('#oct').value=String(sp)+d.join('');const sym=d.map((v,i)=>(v&4?'r':'-')+(v&2?'w':'-')+(i===1&&sp?(v&1?'s':'S'):(v&1?'x':'-'))).join('');
      const who=[['o dono',d[0]],[`o grupo (${t.gA})`,d[1]],['os outros',d[2]]].map(([w,v])=>`<li><b>${w}</b>: ${v===0?'sem acesso':!(v&1)?'não consegue entrar na pasta'+(v&4?' (vê os nomes, mas não abre nada)':''):(v&2?'entra, lê e cria/apaga ficheiros':v&4?'entra e lê':'entra, mas não lista')}</li>`).join('');
      $('#rwxout').innerHTML=`<p class="big"><code>d${sym}</code> = <code>${sp}${d.join('')}</code></p><p class="small">Numa pasta, com estas permissões:</p><ul>${who}</ul><p class="small">Comando: <code>chmod ${sp?sp:''}${d.join('')} pasta</code>${sp?' · os ficheiros novos herdam o grupo':''}</p>`};
    boxes.forEach(b=>b.onchange=show);$('#sgid').onchange=show;$('#oct').oninput=e=>{if(/^[0-7]{3,4}$/.test(e.target.value)){from(e.target.value);show()}};from('0770');show()}}

/* ===== relatório ===== */
function report(){const L=[],A=s=>L.push(s);const t=T();
  A('SO Lab · Trilhos · Relatório');A(`Aluno A: ${ALL.id.a.nome||'(sem nome)'} · N.º ${ALL.id.a.num||'—'}`);A(`Aluno B: ${ALL.id.b.nome||'(sem nome)'} · N.º ${ALL.id.b.num||'—'}`);A(`Equipa ${nn()} (${t.emp})`);A(`Gerado em ${new Date().toLocaleString('pt-PT')}`);
  Object.keys(LABS).forEach(id=>{const Lb=LABS[id],s=TS()[id];A('');A(`== ${Lb.code} · ${Lb.title} (trilho ${TRACKS[Lb.track].name}) ==`);if(!s){A('Por iniciar.');return}
    A(`Estado: ${labDone(id)?'CONCLUÍDO'+(s.doneAt?' em '+s.doneAt:''):'em curso'} · fases: ${PHASES.map(([p,n])=>`${n} ${phaseDone(id,p)?'✓':'—'}`).join(' · ')}`);
    A('Missões:');misState(id).forEach(x=>A(`  [${x.done?'x':' '}] ${x.t}${x.opt?' (desafio)':''}`));
    let ok=false;try{ok=Lb.fixed(s.fault,t)}catch(e){}A(`Avaria: ${ok?'resolvida':'por resolver'}`);A('Diagnóstico: '+(s.diag.trim()||'(sem resposta)'));
    A(`Perguntas: ${QUIZ[id].map((q,j)=>`${j+1} ${s.ans[j]===0?'certa':s.ans[j]===undefined?'—':'errada'}${s.att[j]?` (${s.att[j]} erro${s.att[j]>1?'s':''})`:''}`).join(' · ')}`);
    A('Comparação: '+(s.refl.trim()||'(sem resposta)'));
    A('Registo de ações (prática):');s.prac.log.slice(-25).forEach(x=>A('  '+x));if(s.prac.hist?.length){A('Últimos comandos (prática):');s.prac.hist.slice(-20).forEach(x=>A('  > '+x))}
    A('Registo de ações (avaria):');s.fault.log.slice(-15).forEach(x=>A('  '+x));if(s.fault.hist?.length){A('Últimos comandos (avaria):');s.fault.hist.slice(-12).forEach(x=>A('  > '+x))}});
  return L.join('\n')}
/* ===== entrega à professora ===== */
function wc(s){return words(s).length}
function plLab(id){const Lb=LABS[id],s=TS()[id],t=T();const base={id:Lb.code,titulo:`${Lb.code} · ${Lb.title}`};
  if(!s)return{...base,estado:'por_iniciar'};
  const ms=misState(id),req=ms.filter(x=>!x.opt);let fx=false;try{fx=!!Lb.fixed(s.fault,t)}catch(e){}
  const Q=QUIZ[id],m=[s.prac,s.fault];const hist=[...(s.prac.hist||[]).map(c=>({onde:'Prática',c})),...(s.fault.hist||[]).map(c=>({onde:'Avaria',c}))];
  const errs=m.reduce((n,x)=>n+(x.errs||0),0);
  const touched=s.seen.aprender||hist.length||Object.keys(s.ans).length||s.diag||s.refl||(s.prac.log||[]).length;
  return{...base,estado:labDone(id)?'concluido':touched?'em_curso':'por_iniciar',concluidoEm:/^\d{4}-/.test(s.doneAt||'')?s.doneAt:'',
    fases:PHASES.map(([p,n])=>({nome:n,ok:phaseDone(id,p)})),
    componentes:[{nome:'Missões obrigatórias',valor:req.length?req.filter(x=>x.done).length/req.length:0,detalhe:`${req.filter(x=>x.done).length}/${req.length}`},
      {nome:'Avaria resolvida',valor:fx?1:0,detalhe:fx?'sim':'não'},
      {nome:'Perguntas (meio valor depois de erro)',valor:PL.qscore(Q.length,s.ans,s.att),detalhe:`${Q.filter((q,j)=>s.ans[j]===0).length}/${Q.length} certas`},
      {nome:'Respostas escritas com o mínimo de palavras',valor:((wc(s.diag)>=25)+(wc(s.refl)>=40))/2,detalhe:`${wc(s.diag)} e ${wc(s.refl)} palavras`}],
    missoes:ms.map(x=>({t:x.t,ok:x.done,opt:!!x.opt})),
    perguntas:Q.map((q,j)=>({p:q[0],ok:s.ans[j]===0,respondida:s.ans[j]!==undefined,erros:s.att[j]||0})),
    respostas:[{p:'Diagnóstico da avaria (mín. 25 palavras)',r:s.diag||''},{p:'Comparação Windows / Linux (mín. 40 palavras)',r:s.refl||''}],
    comandos:hist,acoes:[...(s.prac.log||[]).map(x=>'Prática · '+x),...(s.fault.log||[]).map(x=>'Avaria · '+x)],
    tentativas:hist.length,errosComando:errs}}
function plMount(){const el=$('#plbox');if(!el)return;PL.panel(el,{disciplina:'SO',plataforma:'SO Lab · Trilhos',app:'trilhos',
  labIds:()=>Object.values(LABS).map(l=>l.code),labName:c=>{const l=Object.values(LABS).find(x=>x.code===c);return l?`${l.code} · ${l.title}`:c},
  check:()=>(!ALL.id.a.num||!ALL.id.b.num)?'Preencham o nome e o número dos dois alunos na página Trilhos.':null,
  build:()=>({equipa:nn(),alunos:[{num:String(ALL.id.a.num).trim(),nome:ALL.id.a.nome.trim()},{num:String(ALL.id.b.num).trim(),nome:ALL.id.b.nome.trim()}],labs:Object.keys(LABS).map(plLab),relatorio:report()})})}
function renderReport(){$('#view').innerHTML=`<section class="narrow"><div id="plbox"></div><h2>Relatório</h2><p class="lead">Inclui a identificação, o estado das fases, as missões, a avaria, as respostas e o registo de ações e comandos.</p><div class="row"><button id="rcopy">Copiar relatório</button><button class="ghost" id="rdl">Descarregar (.txt)</button><span id="rmsg" class="small"></span></div><pre class="rep" id="rep"></pre></section>`;$('#rep').textContent=report();plMount();
  $('#rcopy').onclick=async()=>{try{await navigator.clipboard.writeText(report());$('#rmsg').textContent='Copiado.'}catch(e){const r=document.createRange();r.selectNodeContents($('#rep'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#rmsg').textContent='Selecionado: usem Ctrl+C.'}};
  $('#rdl').onclick=()=>{try{const u=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=`relatorio-trilhos-eq${nn()}-${([ALL.id.a.num,ALL.id.b.num].filter(Boolean).join('-').replace(/[^\w-]+/g,'')||'alunos')}.txt`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);$('#rmsg').textContent='Se a transferência não começar, usem «Copiar relatório».'}catch(e){$('#rmsg').textContent='Transferência bloqueada: usem «Copiar relatório».'}}}

/* ===== navegação ===== */
function route(){const h=location.hash.slice(1);document.querySelectorAll('.topnav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+(h||'inicio')));document.documentElement.style.removeProperty('--tc');
  if(LABS[h])renderLab(h);else if(h==='relatorio')renderReport();else renderHome();scrollTo(0,0)}
addEventListener('hashchange',route);
route();
