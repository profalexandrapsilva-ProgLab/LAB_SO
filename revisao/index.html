<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SO Lab</title>
<meta name="description" content="SO Lab: 16 laboratórios de Sistemas Operativos no navegador, com consola de treino, perguntas e relatório. UC02829 e UC01990.">
<meta property="og:title" content="SO Lab · Laboratório digital de Sistemas Operativos">
<meta property="og:description" content="16 laboratórios práticos de Sistemas Operativos no navegador. Sem máquinas virtuais.">
<meta property="og:image" content="so-lab-capa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning product, confident and clean, sellable to schools
   IDEA a metro map: the course is a line of 16 stations, Módulo 1 in red, Módulo 2 in blue
   PICTURE the interactive line at the top showing progress; each station opens a lab
   COLOUR white ground, near-black ink, line red #e6261f and blue #0a5cff, amber #ffb400 for "you are here", green for done
   TYPE Figtree 800 for titles, Figtree text, JetBrains Mono in the console
   LAYOUT top bar with brand and student card; full-width line; lab in two columns (mission+console | quiz+evidence); phone stacks */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1116);--ink:light-dark(#11161d,#e8edf3);--mut:light-dark(#4f5b6b,#a5b0bf);--zone:light-dark(#f2f4f7,#171c24);--line:light-dark(#d6dbe2,#2a313c);--panel:light-dark(#ffffff,#141922);--red:#e6261f;--blue:#0a5cff;--amb:#ffb400;--grn:light-dark(#00874c,#2fd38a);--bad:light-dark(#c4291f,#ff7b72)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.08;letter-spacing:-.02em;margin:0 0 .4em}
h2{font-size:clamp(28px,4vw,40px);font-weight:800;text-wrap:balance}
h3{font-size:20px;font-weight:800;margin-top:1.3em}
p{margin:0 0 .8em}
code{font-family:"JetBrains Mono",monospace;font-size:.88em;background:var(--zone);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:14px max(4vw,16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none}
.brand b{font-size:26px;font-weight:800;letter-spacing:-.03em}
.brand span{display:block;font-size:14px;color:var(--mut)}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.who label{font-size:13px;color:var(--mut);display:block;font-weight:500}
.who input,.who select{font:16px Figtree,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px}
.who .n{width:5em}.who .nm{width:12em}.who .tm{width:7em}
.band{padding:18px max(4vw,16px) 8px}
.mapwrap{position:relative;height:130px}
.mapwrap.two{height:190px}
#map{position:absolute;inset:0;width:100%;height:100%}
#map g.st{cursor:pointer}
#map g.st:focus{outline:none}
#map g.st:focus-visible circle.o{stroke:var(--amb);stroke-width:5}
#map text{font:800 13px Figtree,sans-serif;paint-order:stroke;pointer-events:none}
.status{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:4px max(4vw,16px) 14px;border-bottom:1px solid var(--line)}
.meter{flex:1 1 260px;max-width:420px;height:10px;background:var(--zone);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--grn);transition:width .4s}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.legend i{display:inline-block;width:22px;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}
main{max-width:1600px;margin:0 auto;padding:clamp(20px,3vw,36px) max(4vw,16px) 56px}
.kicker{font-weight:600;color:var(--mut);margin-bottom:6px}
.kicker b{color:var(--ink)}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:18px}
@media(max-width:920px){.cols{grid-template-columns:minmax(0,1fr)}}
@media(min-width:921px){.cols>div:first-child{position:sticky;top:12px}}
.mission{background:var(--zone);border-radius:12px;padding:16px 18px}
.mission p:last-child{margin:0}
.req{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.req li{font:600 13px "JetBrains Mono",monospace;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.req li.ok{border-color:var(--grn);color:var(--grn)}
.req li.ok::before{content:"✓ "}
.term{background:#0b0f14;color:#d6e2ee;border-radius:12px;margin-top:14px;overflow:hidden}
.term .bar{display:flex;gap:6px;align-items:center;padding:9px 12px;background:#151b23;font:13px "JetBrains Mono",monospace;color:#8b98a8}
.term .bar i{width:10px;height:10px;border-radius:50%;background:#3a4452}
.term pre{margin:0;padding:12px 14px;height:clamp(340px,calc(100vh - 300px),760px);overflow:auto;white-space:pre;font:var(--twf,14px)/1.5 "JetBrains Mono",monospace}
.term .pw{color:#9fb3c8}.term .pl{color:#7ee08a}.term .er{color:#ff9b93}.term .hl{color:#ffd06b}
.term form{display:flex;gap:8px;align-items:center;border-top:1px solid #222b36;padding:8px 12px}
.term form span{font:13.5px "JetBrains Mono",monospace;color:#7ee08a;white-space:nowrap}
.term input{flex:1;background:transparent;border:0;color:#fff;font:var(--twf,14px) "JetBrains Mono",monospace;min-height:40px;outline:none;caret-color:var(--amb)}
.term button{min-height:40px}
fieldset{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;padding:12px 14px;background:var(--panel)}
legend{font-weight:600;padding:0;float:left;width:100%;margin-bottom:6px}
legend+*{clear:both}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--zone)}
.opt input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--blue)}
.fb{font-size:14px;margin:6px 0 0}
.ok-t{color:var(--grn);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
label.l{display:block;font-weight:600;margin:4px 0 6px}
textarea{width:100%;min-height:150px;font:16px/1.5 Figtree,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.count{font-size:14px;color:var(--mut);margin-top:4px}
button{font:600 15px Figtree,sans-serif;min-height:44px;padding:0 18px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.sec{background:transparent;color:var(--ink);border-color:var(--line)}
button:hover{filter:brightness(1.12)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.panel{border-radius:12px;padding:12px 14px;margin-top:12px;border-left:5px solid var(--line);background:var(--zone)}
.panel.done{border-color:var(--grn)}.panel.todo{border-color:var(--amb)}
.panel ul{margin:6px 0 0;padding-left:20px}
.doneb{display:inline-block;background:var(--grn);color:#fff;font-weight:600;font-size:14px;padding:3px 10px;border-radius:999px;margin-left:10px;vertical-align:middle}
footer{border-top:1px solid var(--line);padding:22px max(4vw,16px);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;color:var(--mut);font-size:14px}
.rep{margin-top:10px}
.rep pre{white-space:pre-wrap;font:13px/1.5 "JetBrains Mono",monospace;background:var(--zone);border-radius:10px;padding:14px;max-height:50vh;overflow:auto}
@media(max-width:600px){.who .nm{width:100%}.who>div{flex:1 1 40%}.who .n,.who .tm{width:100%}.term pre{height:40vh}}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="11" fill="#11161d"/><path d="M8 28 H20 L26 16 H36" stroke="#e6261f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 16 L30 28 H36" stroke="#0a5cff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/><circle cx="20" cy="28" r="4.5" fill="#fff"/><circle cx="26" cy="16" r="4.5" fill="#ffb400"/></svg>
    <div><b>SO Lab</b><span>Laboratório digital de Sistemas Operativos</span></div>
  </div>
  <form class="who" id="who" onsubmit="return false" aria-label="Identificação dos alunos">
    <div><label for="anome">Aluno A · nome</label><input class="nm" id="anome" autocomplete="off"></div>
    <div><label for="anum">N.º</label><input class="n" id="anum" inputmode="numeric" autocomplete="off"></div>
    <div><label for="bnome">Aluno B · nome</label><input class="nm" id="bnome" autocomplete="off"></div>
    <div><label for="bnum">N.º</label><input class="n" id="bnum" inputmode="numeric" autocomplete="off"></div>
    <div><label for="eq">Equipa</label><select class="tm" id="eq"><option value="">—</option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option></select></div>
    <div><label for="turma">Código de turma</label><input class="tm" id="turma" autocomplete="off" spellcheck="false" placeholder="ABC-DEF" maxlength="7" style="text-transform:uppercase;width:7.5em"></div>
  </form>
</div>
<div class="band"><div class="mapwrap" id="mapwrap"><svg id="map" role="group" aria-label="Percurso dos 16 laboratórios"></svg></div></div>
<div class="status"><div class="legend"><span><i style="background:var(--red)"></i>Módulo 1 · UC02829</span><span><i style="background:var(--blue)"></i>Módulo 2 · UC01990</span><span id="ptext"></span></div><div class="meter" aria-hidden="true"><i id="pbar"></i></div></div>
<main id="lesson"></main>
<footer><span>SO Lab · Ambiente de treino simulado: os comandos são reais, as saídas são exemplos e nada é executado no vosso computador.</span><span><a href="../index.html" style="color:inherit">SO Lab · Trilhos</a> · <a href="../bancada/index.html" style="color:inherit">Bancada</a> · A. S. P. Silva</span></footer>
<script>
{
/* ===== ProgLab · entrega à professora (comum a todas as plataformas) =====
   Sem servidor: gera um ficheiro .json que os alunos entregam (Classroom, Teams, pen).
   O código de turma e os prazos ficam guardados neste navegador e são partilhados
   por todas as páginas do mesmo site. */
const PL=(()=>{
  const ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',SK='proglab-turma-v1';
  const clean=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const chk=s=>{let t=0;for(let i=0;i<s.length;i++)t+=(ABC.indexOf(s[i])+1)*(i+3);return ABC[t%32]};
  const valid=c=>{const s=clean(c);return s.length===6&&[...s].every(x=>ABC.includes(x))&&chk(s.slice(0,5))===s[5]};
  const fmt=c=>{const s=clean(c);return s.length>3?s.slice(0,3)+'-'+s.slice(3):s};
  const cyrb=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')};
  const seal=(o,code)=>cyrb(JSON.stringify(o)+'|'+clean(code),0x50524f47);
  let st={code:'',prazos:{}};
  try{const r=JSON.parse(localStorage.getItem(SK)||'null');if(r)st={code:r.code||'',prazos:r.prazos||{}}}catch(e){}
  const keep=()=>{try{localStorage.setItem(SK,JSON.stringify(st))}catch(e){}};
  /* ligação da professora: ?turma=ABC-DEF&p=W5.2026-12-10~L5.2027-01-15 */
  try{const q=new URLSearchParams(location.search);const t=q.get('turma');
    if(t&&valid(t)){if(clean(t)!==clean(st.code))st.prazos={};st.code=fmt(t)}
    const p=q.get('p');if(p&&t&&valid(t)){st.prazos={};p.split('~').forEach(x=>{const m=x.match(/^([A-Za-z0-9-]+)\.(\d{4}-\d{2}-\d{2})$/);if(m)st.prazos[m[1].toUpperCase()]=m[2]})}
    if(t)keep()}catch(e){}
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dpt=d=>{const[y,m,dd]=d.split('-');return `${dd}/${m}/${y}`};
  const css=`.pl-box{border:2px solid #11161d;border-radius:12px;padding:16px 18px;margin:0 0 20px;background:#fff;color:#11161d;font:inherit;max-width:820px}
.pl-box h3{margin:0 0 4px;font-size:1.1rem}.pl-box p{margin:6px 0}.pl-box .pl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.pl-box input{font:inherit;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;border:1.5px solid #5b6470;border-radius:8px;width:9.5em}
.pl-box button{font:inherit;font-weight:700;padding:9px 16px;border-radius:8px;border:0;background:#11161d;color:#fff;cursor:pointer}
.pl-box button:disabled{opacity:.45;cursor:not-allowed}.pl-box .pl-ok{color:#0b7a3b;font-weight:600}.pl-box .pl-bad{color:#b3261e;font-weight:600}
.pl-box .pl-msg{min-height:1.3em}.pl-box ul{margin:6px 0 0;padding-left:20px}.pl-box .pl-late{color:#b3261e;font-weight:600}.pl-box small{color:#5b6470}`;
  function panel(el,cfg){
    if(!document.getElementById('pl-css')){const s=document.createElement('style');s.id='pl-css';s.textContent=css;document.head.append(s)}
    const draw=()=>{
      const ok=valid(st.code);const ids=cfg.labIds();const today=new Date().toISOString().slice(0,10);
      const pz=ids.filter(id=>st.prazos[id]).map(id=>`<li>${esc(cfg.labName(id))}: até ${dpt(st.prazos[id])}${st.prazos[id]<today?' <span class="pl-late">(prazo ultrapassado)</span>':''}</li>`).join('');
      el.innerHTML=`<div class="pl-box" role="region" aria-label="Entrega à professora"><h3>Entregar à professora</h3>
<p>Descarreguem o ficheiro de entrega e enviem-no à professora pelo canal combinado (Classroom, Teams ou pen). Podem entregar várias vezes: fica a versão mais recente.</p>
<div class="pl-row"><label for="pl-code"><b>Código de turma</b></label><input id="pl-code" value="${esc(st.code)}" maxlength="7" autocomplete="off" spellcheck="false" placeholder="ABC-DEF"><span id="pl-cs" class="${ok?'pl-ok':st.code?'pl-bad':''}">${ok?'Código válido':st.code?'Código inválido: confirmem com a professora':''}</span></div>
${pz?`<p style="margin-top:10px"><b>Prazos</b></p><ul>${pz}</ul>`:''}
<div class="pl-row"><button id="pl-dl" ${ok?'':'disabled'}>Descarregar ficheiro de entrega</button><span class="pl-msg" id="pl-msg"></span></div>
<p><small>O ficheiro tem os vossos nomes, números e o trabalho feito nesta página. Não é enviado para nenhum servidor.</small></p></div>`;
      const inp=el.querySelector('#pl-code');
      inp.oninput=()=>{const v=fmt(inp.value);if(clean(v)!==clean(st.code))st.prazos={};st.code=v;keep();const cs=el.querySelector('#pl-cs');const k=valid(v);cs.className=k?'pl-ok':v?'pl-bad':'';cs.textContent=k?'Código válido':clean(v).length<6?'':'Código inválido: confirmem com a professora';el.querySelector('#pl-dl').disabled=!k;cfg.onCode&&cfg.onCode(st.code)};
      inp.onblur=()=>{inp.value=st.code};
      el.querySelector('#pl-dl').onclick=()=>{const msg=el.querySelector('#pl-msg');const prob=cfg.check?cfg.check():null;if(prob){msg.className='pl-msg pl-bad';msg.textContent=prob;return}
        const b=cfg.build();const body={formato:'proglab-entrega',versao:1,disciplina:cfg.disciplina,plataforma:cfg.plataforma,app:cfg.app,turma:fmt(st.code),equipa:b.equipa,alunos:b.alunos,geradoEm:new Date().toISOString(),labs:b.labs.filter(l=>l.estado!=='por_iniciar'),relatorio:b.relatorio||''};
        if(!body.labs.length){msg.className='pl-msg pl-bad';msg.textContent='Ainda não há trabalho para entregar nesta página.';return}
        const file={...body,selo:seal(body,st.code)};
        const nums=b.alunos.map(a=>a.num).filter(Boolean).join('-').replace(/[^\w-]+/g,'')||'alunos';
        const name=`entrega-${cfg.disciplina}-${cfg.app}-eq${b.equipa}-${nums}-${body.geradoEm.slice(0,10)}.json`;
        try{const u=URL.createObjectURL(new Blob([JSON.stringify(file,null,1)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
          msg.className='pl-msg pl-ok';msg.textContent=`Ficheiro «${name}» criado com ${body.labs.length} laboratório${body.labs.length>1?'s':''}. Enviem-no à professora.`}catch(e){msg.className='pl-msg pl-bad';msg.textContent='O navegador bloqueou a transferência. Experimentem outro navegador.'}};
    };
    draw();return{redraw:draw}}
  /* utilitários para os adaptadores */
  const errs=tx=>(tx||[]).filter(o=>o&&o.e).length;
  const qscore=(n,ans,att)=>{let s=0;for(let j=0;j<n;j++)if(ans[j]===0)s+=att&&att[j]?0.5:1;return n?s/n:0};
  const gen=()=>{const a=new Uint32Array(5);crypto.getRandomValues(a);let s='';a.forEach(x=>s+=ABC[x%32]);return fmt(s+chk(s))};
  return{panel,valid,fmt,gen,clean,cyrb,code:()=>st.code,setCode:c=>{const v=fmt(c);if(clean(v)!==clean(st.code))st.prazos={};st.code=v;keep()},prazos:()=>st.prazos,errs,qscore,seal}
})();

/* ===== ProgLab · terminal em ecrã inteiro e tamanho de letra (comum às páginas dos alunos) ===== */
const TW=(()=>{
  const FK='proglab-term-letra';let f=14;try{f=Math.min(22,Math.max(12,+localStorage.getItem(FK)||14))}catch(e){}
  const apply=()=>document.documentElement.style.setProperty('--twf',f+'px');apply();
  const css=`.tw-wrap{min-width:0}
.tw-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;margin:0 0 6px;font:600 13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}
.tw-bar button{min-height:32px;padding:0 10px;border-radius:7px;border:1px solid #9aa3ad;background:#fff;color:#11161d;cursor:pointer;font:inherit;width:auto}
.tw-bar button:hover{background:#eef1f4}.tw-bar button:focus-visible{outline:3px solid #ffb400;outline-offset:1px}
.tw-mis{margin-right:auto;display:none;color:#e8eaed;font-weight:500;max-width:100%}
.tw-fs{position:fixed!important;inset:0;z-index:2000;background:#0b0f14;padding:10px 12px;display:flex;flex-direction:column;margin:0!important;border-radius:0}
.tw-fs .tw-mis{display:block}
.tw-fs .tw-bar button{background:#232b35;color:#fff;border-color:#4a525d}.tw-fs .tw-bar button:hover{background:#2f3945}
.tw-fs>:not(.tw-bar){flex:1;min-height:0;height:auto!important;max-height:none!important;margin-top:0!important}
.tw-fs .envbox:not(.term){display:flex;flex-direction:column}.tw-fs .envbox:not(.term)>*{flex:1;min-height:0}
.tw-fs:not(.tw-pre) .term{height:100%!important}.tw-fs .wdesk{height:100%!important;min-height:0}
.tw-fs.tw-pre .term{display:flex;flex-direction:column}.tw-fs.tw-pre pre{flex:1;height:auto!important}
body.tw-lock{overflow:hidden}`;
  let cur=null,timer=null;
  function off(){if(!cur)return;cur.w.classList.remove('tw-fs');document.body.classList.remove('tw-lock');cur.b.textContent='Ecrã inteiro';cur.b.setAttribute('aria-pressed','false');clearInterval(timer);const t=cur;cur=null;t.focus()}
  addEventListener('keydown',e=>{if(e.key==='Escape'&&cur){e.preventDefault();off()}},true);
  function attach(target,o={}){if(!target||target.closest('.tw-wrap'))return;
    if(!document.getElementById('tw-css')){const s=document.createElement('style');s.id='tw-css';s.textContent=css;document.head.append(s)}
    const w=document.createElement('div');w.className='tw-wrap'+(target.querySelector('pre')?' tw-pre':'');target.parentNode.insertBefore(w,target);
    const bar=document.createElement('div');bar.className='tw-bar';
    bar.innerHTML=`<span class="tw-mis" aria-live="polite"></span>${o.font===false?'':'<button type="button" data-a="-" aria-label="Letra mais pequena">A−</button><button type="button" data-a="+" aria-label="Letra maior">A+</button>'}<button type="button" data-a="fs" aria-pressed="false" title="Esc para sair">Ecrã inteiro</button>`;

const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function rec(i){return S.labs[i]||(S.labs[i]={ans:{},ord:{},att:{},ran:[],tx:[],notes:'',done:false,doneAt:''})}
function order(r,j,n){if(!r.ord[j]){const a=[...Array(n).keys()];for(let k=n-1;k>0;k--){const x=Math.floor(Math.random()*(k+1));[a[k],a[x]]=[a[x],a[k]]}r.ord[j]=a}return r.ord[j]}
function textCheck(i,t){const L=LABS[i],n=norm(t),words=n.split(/[^a-z0-9%\-\/.]+/).filter(w=>w.length>1);const uniq=new Set(words).size;
  const hit=L.kw.filter(k=>k.split('|').some(a=>n.includes(a)));const miss=L.kw.filter(k=>!hit.includes(k)).map(k=>k.split('|')[0]);
  return{words:words.length,uniqOk:words.length===0||uniq/words.length>=0.5,hit:hit.length,miss,ok:words.length>=35&&uniq/words.length>=0.5&&hit.length>=L.kmin}}
function status(i){const L=LABS[i],r=rec(i);const quiz=L.q.every((q,j)=>r.ans[j]===0);const cmds=L.req.every(k=>r.ran.includes(k));const tc=textCheck(i,r.notes);return{quiz,cmds,tc,all:quiz&&cmds&&tc.ok}}
function doneCount(){return LABS.filter((_,i)=>S.labs[i]?.done).length}

/* ---------- mapa ---------- */
function drawMap(){
  const svg=$('map'),wrap=$('mapwrap');const W=wrap.clientWidth;const two=W<820;wrap.classList.toggle('two',two);const H=wrap.clientHeight;
  const pts=[];const m1=LABS.map((l,i)=>i).filter(i=>LABS[i].m===0),m2=LABS.map((l,i)=>i).filter(i=>LABS[i].m===1);
  const pad=26;
  if(!two){const n=LABS.length,step=(W-2*pad)/(n-1);LABS.forEach((l,i)=>pts[i]=[pad+i*step,H*0.6])}
  else{const s1=(W-2*pad)/(m1.length-1);m1.forEach((i,k)=>pts[i]=[pad+k*s1,H*0.36]);const s2=(W-2*pad)/(Math.max(m2.length-1,1));m2.forEach((i,k)=>pts[i]=[pad+k*s2,H*0.82])}
  const r=Math.max(9,Math.min(15,(two?(W-2*pad)/(m1.length-1):(W-2*pad)/(LABS.length-1))/2.7));
  const col=i=>LABS[i].m===0?'#e6261f':'#0a5cff';
  let h='';
  const seg=(ids,c)=>{if(ids.length<2)return'';return `<polyline points="${ids.map(i=>pts[i].join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="${Math.max(6,r*0.7)}" stroke-linecap="round" stroke-linejoin="round"/>`};
  if(!two){h+=seg(m1,'#e6261f')+seg(m2,'#0a5cff');const a=pts[m1[m1.length-1]],b=pts[m2[0]];h+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--line)" stroke-width="5" stroke-dasharray="2 7" stroke-linecap="round"/>`}
  else{h+=seg(m1,'#e6261f')+seg(m2,'#0a5cff')}
  const lab=(i,t)=>{const p=pts[i];return `<text x="${p[0]-r}" y="${p[1]-r-12}" fill="var(--mut)" stroke="var(--bg)" stroke-width="4" style="font-weight:600;font-size:13px">${t}</text>`};
  h+=lab(m1[0],'Módulo 1 · 02829')+lab(m2[0],'Módulo 2 · 01990');
  LABS.forEach((l,i)=>{const p=pts[i],d=S.labs[i]?.done,cur=i===S.cur,c=col(i);const rr=cur?r+3:r;
    h+=`<g class="st" data-i="${i}" tabindex="0" role="button" aria-label="Laboratório ${i+1}: ${esc(l.t)}${d?', concluído':''}${cur?', atual':''}"><title>${i+1}. ${esc(l.t)}</title>${cur?`<circle cx="${p[0]}" cy="${p[1]}" r="${rr+5}" fill="none" stroke="#ffb400" stroke-width="4"/>`:''}<circle class="o" cx="${p[0]}" cy="${p[1]}" r="${rr}" fill="${d?c:'var(--bg)'}" stroke="${c}" stroke-width="3.5"/><text x="${p[0]}" y="${p[1]+4.5}" text-anchor="middle" fill="${d?'#fff':c}" stroke="none">${d?'✓':i+1}</text></g>`});
  svg.innerHTML=h;
  svg.querySelectorAll('g.st').forEach(g=>{const go=()=>{S.cur=+g.dataset.i;save();render();$('lesson').scrollIntoView({block:'start'})};g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
}
const ro=new ResizeObserver(()=>drawMap());ro.observe($('mapwrap'));
function progress(){const n=doneCount();$('pbar').style.width=(n/LABS.length*100)+'%';$('ptext').textContent=`${n} de ${LABS.length} laboratórios concluídos`}

/* ---------- consola ---------- */
const PROMPT={w:'PS C:\\Users\\aluno>',l:'aluno@pc-sala12:~$'};
function addTx(r,o){r.tx.push(o);if(r.tx.length>60)r.tx.splice(0,r.tx.length-60)}
function paintTx(r){const pre=$('out');pre.innerHTML='';if(!r.tx.length){const d=document.createElement('div');d.className='hl';d.textContent='Consola pronta. Escrevam um comando ou help.';pre.append(d);return}
  r.tx.forEach(o=>{if(o.c!==undefined){const d=document.createElement('div');const p=document.createElement('span');p.className=o.os==='l'?'pl':'pw';p.textContent=(PROMPT[o.os]||'>')+' ';d.append(p,document.createTextNode(o.c));pre.append(d)}if(o.o){const d=document.createElement('div');d.className=o.e?'er':(o.h?'hl':'');d.textContent=o.o;pre.append(d)}});pre.scrollTop=pre.scrollHeight}
function run(i,raw){const L=LABS[i],r=rec(i);const c=raw.trim().replace(/\s+/g,' ');if(!c)return;
  r.hist=(r.hist||[]);r.hist.push(c);
  const lc=c.toLowerCase();
  if(lc==='clear'||lc==='cls'){r.tx=[];paintTx(r);save();return}
  if(lc==='help'){addTx(r,{c,os:'w'});addTx(r,{o:'Comandos deste laboratório:\n'+L.cmds.map(x=>`  ${x.k.padEnd(48)} ${x.os==='w'?'Windows':'Ubuntu'}${L.req.includes(x.k)?'  (obrigatório)':''}`).join('\n')+'\nOutros: help, clear, history',h:1});paintTx(r);save();return}
  if(lc==='history'){addTx(r,{c,os:'w'});addTx(r,{o:r.hist.map((h,k)=>`${String(k+1).padStart(4)}  ${h}`).join('\n')});paintTx(r);save();return}
  const m=L.cmds.find(x=>x.re.test(c));
  if(!m){r.errs=(r.errs||0)+1;const os=/^(sudo|ls|cat|apt|ip|free|lsblk|ps|df|uname|id)\b/.test(lc)?'l':'w';addTx(r,{c,os});addTx(r,{o:`«${c}» não está disponível neste laboratório. Escrevam help para ver os comandos.`,e:1});paintTx(r);save();return}
  addTx(r,{c,os:m.os});addTx(r,{o:m.out});if(!r.ran.includes(m.k))r.ran.push(m.k);paintTx(r);save();updReq(i);updPanel(i)}

/* ---------- lição ---------- */
function updReq(i){const L=LABS[i],r=rec(i);$('req').innerHTML=L.req.map(k=>`<li class="${r.ran.includes(k)?'ok':''}">${esc(k)}</li>`).join('')}
function updCount(i){const t=textCheck(i,rec(i).notes);$('count').textContent=`${t.words} palavras (mínimo 35) · ${t.hit} de ${LABS[i].kmin} conceitos-chave necessários${t.uniqOk?'':' · demasiadas palavras repetidas'}`}
function updPanel(i){const L=LABS[i],r=rec(i),s=status(i),p=$('panel');if(!p)return;
  if(r.done){p.className='panel done';p.innerHTML=`<b>Laboratório concluído</b>${r.doneAt?` em ${esc(r.doneAt)}`:''}. Podem continuar a melhorar a resposta: a conclusão mantém-se e a professora revê a versão final.`;return}
  if(!r.checked){p.className='panel';p.innerHTML='Quando terminarem, carreguem em <b>Verificar e concluir</b>.';return}
  const items=[];if(!s.cmds)items.push('Executem na consola: '+L.req.filter(k=>!r.ran.includes(k)).map(k=>`<code>${esc(k)}</code>`).join(', ')+'.');
  const wrong=L.q.map((q,j)=>r.ans[j]===0?null:j+1).filter(Boolean);if(wrong.length)items.push(`Revejam ${wrong.length===1?'a pergunta':'as perguntas'} ${wrong.join(', ')}.`);
  if(!s.tc.ok){const a=[];if(s.tc.words<35)a.push(`tem ${s.tc.words} palavras (mínimo 35)`);if(!s.tc.uniqOk)a.push('repete demasiado as mesmas palavras');if(s.tc.hit<L.kmin)a.push(`refere ${s.tc.hit} de ${L.kmin} conceitos necessários. Considerem abordar: ${s.tc.miss.join(', ')}`);items.push('A resposta escrita '+a.join('; ')+'.')}
  p.className='panel todo';p.innerHTML=`<b>Ainda falta:</b><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul>`}
function render(){
  const i=S.cur,L=LABS[i],M=MODULES[L.m],r=rec(i);
  $('lesson').innerHTML=`<div class="kicker"><b>Lab ${i+1} de ${LABS.length}</b> · Módulo ${L.m+1} · UC${M.code} · ${esc(M.title)}</div>
  <h2>${esc(L.t)}${r.done?'<span class="doneb">Concluído</span>':''}</h2><p style="color:var(--mut);max-width:70ch">${esc(L.o)}</p>
  <div class="mission"><b>Missão</b><p>${esc(L.mi)}</p><b style="font-size:14px">Comandos obrigatórios</b><ul class="req" id="req"></ul></div>
   <div class="term"><div class="bar"><i></i><i></i><i></i><span style="margin-left:8px">Consola de treino · Windows e Ubuntu</span></div><pre id="out" aria-live="polite"></pre>
   <form id="tf"><span aria-hidden="true">›</span><label for="cmd" class="vh" style="position:absolute;left:-9999px">Comando</label><input id="cmd" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="escrevam um comando… (help)"><button>Executar</button></form></div>
  <div class="cols"><div>
   <h3 style="margin-top:0">Verifiquem o que aprenderam</h3><div id="quiz"></div>
  </div><div>
   <h3 style="margin-top:0">Resposta à missão</h3><label class="l" for="notes">Usem os resultados da consola e justifiquem as decisões.</label><textarea id="notes"></textarea><div class="count" id="count"></div>
   <div id="panel" class="panel" role="status"></div>
   <div class="actions"><button id="check">Verificar e concluir</button><button class="sec" id="prev">Anterior</button><button class="sec" id="next">Seguinte</button></div>
  </div></div>
  <div id="plbox" style="margin-top:28px"></div>
  <h3>Relatório</h3><p style="color:var(--mut)">Junta a identificação dos dois alunos, o estado de cada laboratório, as respostas e os comandos executados.</p>
  <div class="actions" style="margin-top:0"><button class="sec" id="exp">Descarregar relatório (.txt)</button><button class="sec" id="cpy">Copiar relatório</button><span id="rmsg" style="align-self:center;color:var(--mut)"></span></div>
  <details class="rep"><summary>Pré-visualizar o relatório</summary><pre id="rep"></pre></details>`;
  updReq(i);paintTx(r);plMount();TW.attach($('out').closest('.term'),{mission:()=>{const rr=S.labs[S.cur]||{ran:[]};const k=LABS[S.cur].req.filter(c=>!(rr.ran||[]).includes(c));return k.length?`executar ${k.join(', ')}`:LABS[S.cur].mi}});
  $('quiz').innerHTML=L.q.map((q,j)=>{const ord=order(r,j,q[1].length);return `<fieldset><legend>${j+1}. ${esc(q[0])}</legend>${ord.map(k=>`<label class="opt"><input type="radio" name="q${j}" value="${k}"${r.ans[j]===k?' checked':''}><span>${esc(q[1][k])}</span></label>`).join('')}<p class="fb" id="fb${j}"></p></fieldset>`}).join('');
  L.q.forEach((q,j)=>{document.querySelectorAll(`input[name=q${j}]`).forEach(x=>x.onchange=()=>{r.ans[j]=+x.value;$('fb'+j).textContent='';save()});if(r.checked)fb(i,j)});
  $('notes').value=r.notes;updCount(i);updPanel(i);
  $('notes').oninput=e=>{r.notes=e.target.value;updCount(i);save()};
  $('tf').onsubmit=e=>{e.preventDefault();const v=$('cmd').value;$('cmd').value='';hi=-1;run(i,v)};
  let hi=-1;$('cmd').onkeydown=e=>{const h=r.hist||[];if(e.key==='ArrowUp'&&h.length){e.preventDefault();hi=hi<0?h.length-1:Math.max(0,hi-1);$('cmd').value=h[hi]}else if(e.key==='ArrowDown'&&hi>=0){e.preventDefault();hi++;$('cmd').value=hi<h.length?h[hi]:'';if(hi>=h.length)hi=-1}};
  $('check').onclick=()=>{r.checked=true;L.q.forEach((q,j)=>{if(r.ans[j]!==undefined&&r.ans[j]!==0)r.att[j]=(r.att[j]||0)+1;fb(i,j)});const s=status(i);if(s.all&&!r.done){r.done=true;r.doneAt=new Date().toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'})}flush();render();if(r.done)$('panel').scrollIntoView({block:'center'})};
  $('prev').onclick=()=>{S.cur=(i+LABS.length-1)%LABS.length;save();render();$('lesson').scrollIntoView({block:'start'})};
  $('next').onclick=()=>{S.cur=(i+1)%LABS.length;save();render();$('lesson').scrollIntoView({block:'start'})};
  $('exp').onclick=()=>{try{const url=URL.createObjectURL(new Blob([report()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`relatorio-so-lab-${([S.id.anum,S.id.bnum].filter(Boolean).join('-').replace(/[^\w-]+/g,'')||'alunos')}.txt`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);$('rmsg').textContent='Se a transferência não começar, usem «Copiar relatório».'}catch(e){$('rmsg').textContent='Transferência bloqueada: usem «Copiar relatório».'}};
  $('cpy').onclick=async()=>{const t=report();try{await navigator.clipboard.writeText(t);$('rmsg').textContent='Relatório copiado.'}catch(e){const d=$('lesson').querySelector('details');d.open=true;$('rep').textContent=t;const rg=document.createRange();rg.selectNodeContents($('rep'));const s=getSelection();s.removeAllRanges();s.addRange(rg);$('rmsg').textContent='Texto selecionado: usem Ctrl+C.'}};
  $('lesson').querySelector('details').ontoggle=e=>{if(e.target.open)$('rep').textContent=report()};
  drawMap();progress();
}
function fb(i,j){const L=LABS[i],r=rec(i),q=L.q[j],p=$('fb'+j);if(!p)return;const a=r.ans[j];
  if(a===undefined){p.className='fb bad-t';p.textContent='Escolham uma opção.';return}
  if(a===0){p.className='fb';p.innerHTML=`<span class="ok-t">Certo.</span> ${esc(q[2])}`;return}
  p.className='fb';p.innerHTML=`<span class="bad-t">Ainda não.</span> ${(r.att[j]||0)>=2?'Explicação: '+esc(q[2]):'Revejam o conceito e tentem outra vez.'}`}
/* ---------- entrega à professora ---------- */
const RID=i=>'R'+String(i+1).padStart(2,'0');
function plLab(i){const L=LABS[i],r=S.labs[i],base={id:RID(i),titulo:`Revisão ${i+1} · ${L.t}`};
  if(!r||!((r.hist||[]).length||Object.keys(r.ans).length||r.notes.trim()))return{...base,estado:'por_iniciar'};
  const s=status(i),ran=L.req.filter(k=>r.ran.includes(k)).length;
  return{...base,estado:r.done?'concluido':'em_curso',concluidoEm:r.doneAt||'',
    componentes:[{nome:'Comandos obrigatórios executados',valor:L.req.length?ran/L.req.length:0,detalhe:`${ran}/${L.req.length}`},
      {nome:'Perguntas (meio valor depois de erro)',valor:PL.qscore(L.q.length,r.ans,r.att),detalhe:`${L.q.filter((q,j)=>r.ans[j]===0).length}/${L.q.length} certas`},
      {nome:'Resposta à missão (palavras e conceitos-chave)',valor:s.tc.ok?1:Math.min(.5,s.tc.hit/Math.max(1,L.kmin)/2),detalhe:`${s.tc.words} palavras · ${s.tc.hit}/${L.kmin} conceitos`}],
    missoes:L.req.map(k=>({t:'Executar '+k,ok:r.ran.includes(k)})),
    perguntas:L.q.map((q,j)=>({p:q[0],ok:r.ans[j]===0,respondida:r.ans[j]!==undefined,erros:r.att[j]||0})),
    respostas:[{p:L.mi||'Resposta à missão',r:r.notes||''}],comandos:(r.hist||[]).map(c=>({onde:'Consola',c})),acoes:[],
    tentativas:(r.hist||[]).length,errosComando:r.errs||0}}
let PLP=null;
function plMount(){const el=$('plbox');if(!el)return;PLP=PL.panel(el,{disciplina:'SO',plataforma:'SO Lab · Revisão',app:'revisao',labIds:()=>LABS.map((_,i)=>RID(i)),labName:id=>{const i=+id.slice(1)-1;return LABS[i]?`Revisão ${i+1} · ${LABS[i].t}`:id},
  onCode:c=>{$('turma').value=c},
  check:()=>(!String(S.id.anum).trim()||!String(S.id.bnum).trim())?'Preencham o nome e o número dos dois alunos no topo da página.':null,
  build:()=>({equipa:S.id.eq||'',alunos:[{num:String(S.id.anum).trim(),nome:S.id.anome.trim()},{num:String(S.id.bnum).trim(),nome:S.id.bnome.trim()}],labs:LABS.map((_,i)=>plLab(i)),relatorio:report()})})}
function report(){const L=[];const A=s=>L.push(s);
  A('SO Lab · Relatório de aprendizagem');A(`Aluno A: ${S.id.anome||'(sem nome)'} · N.º ${S.id.anum||'—'}`);A(`Aluno B: ${S.id.bnome||'(sem nome)'} · N.º ${S.id.bnum||'—'}`);A(`Equipa: ${S.id.eq||'—'} · Código de turma: ${PL.code()||'—'}`);A(`Gerado em ${new Date().toLocaleString('pt-PT')}`);A(`Concluídos: ${doneCount()} de ${LABS.length}`);
  LABS.forEach((l,i)=>{const r=S.labs[i];if(!r){A('');A(`${i+1}. ${l.t} · por iniciar`);return}const s=status(i);
    A('');A(`${i+1}. ${l.t} · ${r.done?'Concluído'+(r.doneAt?' em '+r.doneAt:''):'Em curso'}`);
    A(`   Comandos obrigatórios: ${l.req.map(k=>(r.ran.includes(k)?'[x] ':'[ ] ')+k).join(' | ')}`);
    A(`   Perguntas: ${l.q.map((q,j)=>`${j+1} ${r.ans[j]===0?'certa':r.ans[j]===undefined?'sem resposta':'errada'}${r.att[j]?` (${r.att[j]} tentativa${r.att[j]>1?'s':''} errada${r.att[j]>1?'s':''})`:''}`).join(' · ')}`);
    A(`   Resposta escrita: ${s.tc.words} palavras, ${s.tc.hit}/${l.kw.length} conceitos`);A('   '+(r.notes.trim()||'(sem resposta)').replace(/\n/g,'\n   '))});
  return L.join('\n')}
['anome','anum','bnome','bnum','eq'].forEach(k=>$(k).value=S.id[k]||'');
['anome','anum','bnome','bnum'].forEach(k=>$(k).oninput=e=>{S.id[k]=e.target.value;save()});$('eq').onchange=e=>{S.id.eq=e.target.value;save()};
if(!PL.code()&&PL.valid(S.id.turma||''))PL.setCode(S.id.turma);$('turma').value=PL.code();
$('turma').oninput=e=>{PL.setCode(e.target.value);PLP&&PLP.redraw()};$('turma').onblur=e=>{e.target.value=PL.code()};
render();
}
</script>
