<style>

*{box-sizing:border-box}

<main id="main"></main>
<footer>ProgLab Teacher · Os dados ficam só neste navegador, neste computador. Nada é enviado para servidores. Façam cópias de segurança regularmente em «Dados e privacidade». · Alexandra Silva @ 2026</footer>
<script>
/* ===== ProgLab · entrega à professora (comum a todas as plataformas) =====
   Sem servidor: gera um ficheiro .json que os alunos entregam (Classroom, Teams, pen).
   O código de turma e os prazos ficam guardados neste navegador e são partilhados
   por todas as páginas do mesmo site. */
const PL=(()=>{
  const ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',SK='proglab-turma-v1';
  const clean=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const chk=s=>{let t=0;for(let i=0;i<s.length;i++)t+=(ABC.indexOf(s[i])+1)*(i+3);return ABC[t%32]};
  const valid=c=>{const s=clean(c);return s.length===6&&[...s].every(x=>ABC.includes(x))&&chk(s.slice(0,5))===s[5]};
  const fmt=c=>{const s=clean(c);return s.length>3?s.slice(0,3)+'-'+s.slice(3):s};
  const cyrb=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')};
  const seal=(o,code)=>cyrb(JSON.stringify(o)+'|'+clean(code),0x50524f47);
  let st={code:'',prazos:{}};
  try{const r=JSON.parse(localStorage.getItem(SK)||'null');if(r)st={code:r.code||'',prazos:r.prazos||{}}}catch(e){}
  const keep=()=>{try{localStorage.setItem(SK,JSON.stringify(st))}catch(e){}};
  /* ligação da professora: ?turma=ABC-DEF&p=W5.2026-12-10~L5.2027-01-15 */
  try{const q=new URLSearchParams(location.search);const t=q.get('turma');
    if(t&&valid(t)){if(clean(t)!==clean(st.code))st.prazos={};st.code=fmt(t)}
    const p=q.get('p');if(p&&t&&valid(t)){st.prazos={};p.split('~').forEach(x=>{const m=x.match(/^([A-Za-z0-9-]+)\.(\d{4}-\d{2}-\d{2})$/);if(m)st.prazos[m[1].toUpperCase()]=m[2]})}
    if(t)keep()}catch(e){}
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dpt=d=>{const[y,m,dd]=d.split('-');return `${dd}/${m}/${y}`};
  const css=`.pl-box{border:2px solid #11161d;border-radius:12px;padding:16px 18px;margin:0 0 20px;background:#fff;color:#11161d;font:inherit;max-width:820px}
.pl-box h3{margin:0 0 4px;font-size:1.1rem}.pl-box p{margin:6px 0}.pl-box .pl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.pl-box input{font:inherit;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;border:1.5px solid #5b6470;border-radius:8px;width:9.5em}
.pl-box button{font:inherit;font-weight:700;padding:9px 16px;border-radius:8px;border:0;background:#11161d;color:#fff;cursor:pointer}
.pl-box button:disabled{opacity:.45;cursor:not-allowed}.pl-box .pl-ok{color:#0b7a3b;font-weight:600}.pl-box .pl-bad{color:#b3261e;font-weight:600}
.pl-box .pl-msg{min-height:1.3em}.pl-box ul{margin:6px 0 0;padding-left:20px}.pl-box .pl-late{color:#b3261e;font-weight:600}.pl-box small{color:#5b6470}`;
  function panel(el,cfg){
    if(!document.getElementById('pl-css')){const s=document.createElement('style');s.id='pl-css';s.textContent=css;document.head.append(s)}
    const draw=()=>{
      const ok=valid(st.code);const ids=cfg.labIds();const today=new Date().toISOString().slice(0,10);
      const pz=ids.filter(id=>st.prazos[id]).map(id=>`<li>${esc(cfg.labName(id))}: até ${dpt(st.prazos[id])}${st.prazos[id]<today?' <span class="pl-late">(prazo ultrapassado)</span>':''}</li>`).join('');
      el.innerHTML=`<div class="pl-box" role="region" aria-label="Entrega à professora"><h3>Entregar à professora</h3>
<p>Descarreguem o ficheiro de entrega e enviem-no à professora pelo canal combinado (Classroom, Teams ou pen). Podem entregar várias vezes: fica a versão mais recente.</p>
<div class="pl-row"><label for="pl-code"><b>Código de turma</b></label><input id="pl-code" value="${esc(st.code)}" maxlength="7" autocomplete="off" spellcheck="false" placeholder="ABC-DEF"><span id="pl-cs" class="${ok?'pl-ok':st.code?'pl-bad':''}">${ok?'Código válido':st.code?'Código inválido: confirmem com a professora':''}</span></div>
${pz?`<p style="margin-top:10px"><b>Prazos</b></p><ul>${pz}</ul>`:''}
<div class="pl-row"><button id="pl-dl" ${ok?'':'disabled'}>Descarregar ficheiro de entrega</button><span class="pl-msg" id="pl-msg"></span></div>
<p><small>O ficheiro tem os vossos nomes, números e o trabalho feito nesta página. Não é enviado para nenhum servidor.</small></p></div>`;
      const inp=el.querySelector('#pl-code');
      inp.oninput=()=>{const v=fmt(inp.value);if(clean(v)!==clean(st.code))st.prazos={};st.code=v;keep();const cs=el.querySelector('#pl-cs');const k=valid(v);cs.className=k?'pl-ok':v?'pl-bad':'';cs.textContent=k?'Código válido':clean(v).length<6?'':'Código inválido: confirmem com a professora';el.querySelector('#pl-dl').disabled=!k;cfg.onCode&&cfg.onCode(st.code)};
      inp.onblur=()=>{inp.value=st.code};
      el.querySelector('#pl-dl').onclick=()=>{const msg=el.querySelector('#pl-msg');const prob=cfg.check?cfg.check():null;if(prob){msg.className='pl-msg pl-bad';msg.textContent=prob;return}
        const b=cfg.build();const body={formato:'proglab-entrega',versao:1,disciplina:cfg.disciplina,plataforma:cfg.plataforma,app:cfg.app,turma:fmt(st.code),equipa:b.equipa,alunos:b.alunos,geradoEm:new Date().toISOString(),labs:b.labs.filter(l=>l.estado!=='por_iniciar'),relatorio:b.relatorio||''};
        if(!body.labs.length){msg.className='pl-msg pl-bad';msg.textContent='Ainda não há trabalho para entregar nesta página.';return}
        const file={...body,selo:seal(body,st.code)};
        const nums=b.alunos.map(a=>a.num).filter(Boolean).join('-').replace(/[^\w-]+/g,'')||'alunos';
        const name=`entrega-${cfg.disciplina}-${cfg.app}-eq${b.equipa}-${nums}-${body.geradoEm.slice(0,10)}.json`;
        try{const u=URL.createObjectURL(new Blob([JSON.stringify(file,null,1)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
          msg.className='pl-msg pl-ok';msg.textContent=`Ficheiro «${name}» criado com ${body.labs.length} laboratório${body.labs.length>1?'s':''}. Enviem-no à professora.`}catch(e){msg.className='pl-msg pl-bad';msg.textContent='O navegador bloqueou a transferência. Experimentem outro navegador.'}};
    };
    draw();return{redraw:draw}}
  /* utilitários para os adaptadores */
  const errs=tx=>(tx||[]).filter(o=>o&&o.e).length;
  const qscore=(n,ans,att)=>{let s=0;for(let j=0;j<n;j++)if(ans[j]===0)s+=att&&att[j]?0.5:1;return n?s/n:0};
  const gen=()=>{const a=new Uint32Array(5);crypto.getRandomValues(a);let s='';a.forEach(x=>s+=ABC[x%32]);return fmt(s+chk(s))};
  return{panel,valid,fmt,gen,clean,cyrb,code:()=>st.code,setCode:c=>{const v=fmt(c);if(clean(v)!==clean(st.code))st.prazos={};st.code=v;keep()},prazos:()=>st.prazos,errs,qscore,seal}
})();

/* ======================= dados e catálogo ======================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SITE='https://profalexandrapsilva-proglab.github.io/LAB_SO/';
const REV=['Hardware e sistema operativo','Firmware e arranque','Instalação do sistema operativo','Discos, partições e sistemas de ficheiros','Periféricos e controladores','Processos, memória e desempenho','Utilizadores, grupos e permissões','Partilha de recursos e ficheiros','Rede e diagnóstico','Virtualização e recuperação','Software complementar: escolha e licenças','Instalação e configuração de aplicações','Atualizações e manutenção','Cópias de segurança e imagens de restauro','Segurança: antivírus e firewall','Projeto final de manutenção'];
const CAT={
  SO:{nome:'Sistemas Operativos',curto:'SO',plataformas:[
    {app:'bancada',nome:'Bancada',path:'bancada/index.html',labs:[['LAB01','Lab 01 · Interpretar o equipamento'],['LAB02','Lab 02 · Planear e criar a máquina virtual'],['LAB03','Lab 03 · Instalar o Ubuntu'],['BUBU','Bancada · Terminal Ubuntu'],['BWIN','Bancada · Terminal Windows']]},
    {app:'trilhos',nome:'Trilhos',path:'index.html',labs:[['W5','W5 · Contas, UAC e permissões NTFS'],['L5','L5 · Utilizadores, grupos e permissões']]},
    {app:'revisao',nome:'Revisão',path:'revisao/index.html',labs:REV.map((t,i)=>['R'+String(i+1).padStart(2,'0'),`Revisão ${i+1} · ${t}`])}]},
  CPP:{nome:'Programação C++',curto:'C++',brevemente:true,plataformas:[]},
  POO:{nome:'Programação Orientada a Objetos (Java)',curto:'Java POO',brevemente:true,plataformas:[]},
  BD:{nome:'Bases de Dados',curto:'BD',brevemente:true,plataformas:[]}};
const DK='proglab-teacher-v1';
let D={v:1,turmas:{},entregas:[],fich:{},aval:{},cur:null,cfg:{base:SITE,pin:null}};
// Cofre local: IndexedDB + AES-GCM; a chave nunca é persistida.
let saveErr='', vaultKey=null, vaultSalt=null, db=null, pending=Promise.resolve(), unlocked=false, pendingCount=0;
addEventListener('beforeunload',e=>{if(pendingCount||saveErr){e.preventDefault();e.returnValue=''}});
const bytesTo64=b=>{let out='';for(let i=0;i<b.length;i+=8192)out+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(out)};
const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const random=n=>crypto.getRandomValues(new Uint8Array(n));
async function derive(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(data,key=vaultKey,salt=vaultSalt){const iv=random(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(data)));return {formato:'proglab-teacher-vault',versao:2,salt:bytesTo64(salt),iv:bytesTo64(iv),cipher:bytesTo64(new Uint8Array(ct))}}
async function decrypt(box,key){if(!box||box.formato!=='proglab-teacher-vault'||box.versao!==2||typeof box.cipher!=='string'||box.cipher.length>80e6||from64(box.salt).length!==16||from64(box.iv).length!==12)throw Error('Formato de cofre inválido');return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(box.iv)},key,from64(box.cipher))))}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('proglab-teacher-v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('vault');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function store(mode,value){return new Promise((resolve,reject)=>{const tx=db.transaction('vault',mode);const st=tx.objectStore('vault');const r=mode==='readonly'?st.get('data'):st.put(value,'data');tx.oncomplete=()=>resolve(r.result);tx.onerror=tx.onabort=()=>reject(tx.error||Error('Falha de armazenamento'))})}
function save(){if(!unlocked)return Promise.resolve(false);const snapshot=structuredClone(D);pendingCount++;pending=pending.then(async()=>{try{await store('readwrite',await encrypt(snapshot));saveErr='';return true}catch(e){saveErr='Não foi possível guardar. Exporte uma cópia de segurança antes de sair.';const n=$('#saveerr');if(n){n.textContent=saveErr;n.classList.remove('hide')}else alert(saveErr);return false}finally{pendingCount--}});return pending}

function links(t){const pz=assigned(t).filter(k=>t.atrib[k].prazo).map(k=>`${k}.${t.atrib[k].prazo}`).join('~');const base=(D.cfg.base||SITE).replace(/\/?$/,'/');

${c.plataformas.map(p=>`<div class="card"><h2>${esc(p.nome)}</h2><div class="tw"><table><thead><tr><th style="width:3em">Atribuir</th><th>Laboratório</th><th>Prazo</th></tr></thead><tbody>${p.labs.map(([k,n])=>`<tr><td><input type="checkbox" data-k="${k}" id="c-${k}"${t.atrib[k]?' checked':''}></td><td><label for="c-${k}" style="font-weight:500">${esc(n)}</label></td><td><input type="date" data-d="${k}" value="${t.atrib[k]?.prazo||''}" aria-label="Prazo de ${esc(n)}"${t.atrib[k]?'':' disabled'}></td></tr>`).join('')}</tbody></table></div></div>`).join('')}`;
  const upd=()=>{save();const L=links(t);$$('#lk input').forEach((x,i)=>x.value=L[i].url)};

      h.push([dt(e.recebidoEm),dt(e.geradoEm),e.eq,e.alunos.map(x=>`${x.num} ${x.nome}`.trim()).join('; '),labName(t,e.lab),e.dados.estado==='concluido'?'concluído':'incompleto',auto(e)??'',mine&&a.nota!=null?a.nota:'',late(t,e)?'sim':'não',e.seloOk?'válido':'inválido',v[0].id===e.id?'mais recente':'anterior',mine?a.feedback||'':''])});
    const blob=xlsx([{name:'Pauta',rows:p,w:[7,28,8,...L.map(()=>14),9]},{name:'Entregas',rows:h,w:[16,16,8,34,34,14,10,10,10,9,13,60]}]);

/* xlsx mínimo, sem bibliotecas: ZIP sem compressão com SpreadsheetML */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}})();
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  files.forEach(([name,txt])=>{const nb=enc.encode(name),db=enc.encode(txt),crc=CRC(db);const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nb,db);const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,db.length,true);c.setUint32(24,db.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);cd.push(c.buffer,nb);off+=30+nb.length+db.length});
  const cdl=cd.reduce((s,b)=>s+(b.byteLength??b.length),0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdl,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e.buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xlsx(sheets){const x=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');
  const col=i=>{let s='';i++;while(i){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26)}return s};
  const ws=sh=>`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${(sh.w||[]).map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${sh.rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{const ref=col(ci)+(ri+1),st=ri===0?' s="1"':'';if(v===''||v==null)return ri===0?`<c r="${ref}"${st}/>`:'';if(typeof v==='number'&&isFinite(v))return `<c r="${ref}"${st}><v>${v}</v></c>`;return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${x(v)}</t></is></c>`}).join('')}</row>`).join('')}</sheetData></worksheet>`;
  const f=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],
    ...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,ws(s)])];
  return zip(f)}

<div class="g2"><div class="card"><h2>Código de turma</h2><p><span class="code">${esc(t.code)}</span></p><p>Os alunos escrevem este código no separador Relatório do SO Lab, ou abrem a ligação de «Laboratórios e prazos». Sem um código válido não conseguem descarregar a entrega.</p>
<details><summary class="small" style="cursor:pointer">Gerar um código novo</summary><p class="small">Usem só se o código tiver sido divulgado fora da turma. Os ficheiros com o código antigo deixam de ser aceites.</p><button class="sec" id="regen">Gerar código novo</button></details></div>
<form class="card" id="tf"><h2>Dados da turma</h2><div class="fld"><label for="tn">Nome</label><input id="tn" value="${esc(t.nome)}" required></div>
<div class="fld"><label for="te">Número de equipas</label><input id="te" type="number" min="1" max="8" value="${t.nEq}" style="max-width:8em"></div><button>Guardar</button> <span id="tm" class="small" role="status"></span></form></div>
<div class="card"><h2>Alunos (${t.alunos.length})</h2>
<div class="tw"><table><thead><tr><th>N.º</th><th>Nome</th><th>Equipa</th><th></th></tr></thead><tbody id="al">${t.alunos.slice().sort((a,b)=>+a.num-+b.num).map(a=>`<tr><td>${esc(a.num)}</td><td>${esc(a.nome)}</td><td><select data-eq="${esc(a.num)}" aria-label="Equipa de ${esc(a.nome)}"><option value="">—</option>${eqs(t).map(q=>`<option${a.eq===q?' selected':''}>${q}</option>`).join('')}</select></td><td><button type="button" class="lnk" data-del="${esc(a.num)}">Remover</button></td></tr>`).join('')}</tbody></table></div>
<form class="row" id="af" style="margin-top:12px"><input id="anum" placeholder="N.º" inputmode="numeric" style="width:6em" aria-label="Número" required><input id="anome" placeholder="Primeiro nome e apelido" style="flex:1;min-width:200px" aria-label="Nome" required><select id="aeq" aria-label="Equipa"><option value="">Equipa</option>${eqs(t).map(q=>`<option>${q}</option>`).join('')}</select><button>Adicionar</button></form>
<details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">Colar uma lista</summary><p class="small">Uma linha por aluno: <span class="mono">número;nome;equipa</span> (a equipa é opcional). Também aceita tabulação, para colar diretamente do Excel. Números repetidos atualizam o aluno.</p><textarea id="paste" class="mono" placeholder="1;Ana Martins;01&#10;2;Bruno Costa;01"></textarea><button type="button" id="pb" style="margin-top:8px">Importar lista</button> <span id="pm" class="small" role="status"></span></details>
<p class="small" style="margin-top:14px">Equipas: ${eqs(t).map(q=>`${q} (${cnt(q)})`).join(' · ')}${eqs(t).some(q=>cnt(q)>2)?' · <b>Atenção: há equipas com mais de dois alunos.</b>':''}</p></div>
<div class="card"><h2>Apagar esta turma</h2><p>Apaga a turma, os alunos, as entregas importadas e as avaliações. Não pode ser desfeito: descarreguem antes uma cópia de segurança.</p><button class="dng" id="del">Apagar turma «${esc(t.nome)}»</button></div>`;
  $('#tf').onsubmit=e=>{e.preventDefault();t.nome=$('#tn').value.trim().slice(0,200)||t.nome;if(D.entregas.some(x=>x.turmaId===t.id)&&+$('#te').value!==t.nEq){alert('Não altere a composição de uma turma com entregas. Crie uma nova turma.');return}t.nEq=Math.max(1,Math.min(8,+$('#te').value||t.nEq));t.alunos.forEach(a=>{if(a.eq&&+a.eq>t.nEq)a.eq=''});save();route()};
  $('#regen').onclick=()=>{t.code=PL.gen();save();route()};
  const add=(num,nome,eq)=>{if(D.entregas.some(x=>x.turmaId===t.id))return false;num=nk(num);if(!validNum(num))return false;nome=nome.slice(0,80);eq=/^\d{1,2}$/.test(eq||'')&&+eq>=1&&+eq<=t.nEq?pad(+eq):'';const ex=t.alunos.find(a=>nk(a.num)===num);if(eq&&t.alunos.filter(a=>a.eq===eq&&a.num!==num).length>=2)return false;if(ex){ex.nome=nome||ex.nome;if(eq)ex.eq=eq}else t.alunos.push({num,nome:nome.slice(0,80),eq});return true};
  $('#af').onsubmit=e=>{e.preventDefault();if(add($('#anum').value,$('#anome').value.trim(),$('#aeq').value)){save();route();$('#anum').focus()}else alert('Número inválido, equipa cheia ou turma com entregas registadas.')};
  $('#pb').onclick=()=>{let ok=0,bad=0;$('#paste').value.split(/\r?\n/).forEach(l=>{if(!l.trim())return;const p=l.split(/[;\t,]/).map(x=>x.trim());if(add(p[0],p[1]||'',p[2]||''))ok++;else bad++});save();route();$('#pm')&&($('#pm').textContent=`${ok} importados${bad?`, ${bad} linhas ignoradas`:''}.`)};
  $$('[data-eq]').forEach(s=>s.onchange=()=>{if(D.entregas.some(x=>x.turmaId===t.id)){alert('Turma com entregas: composição bloqueada.');route();return}const a=t.alunos.find(x=>x.num===s.dataset.eq);if(s.value&&t.alunos.filter(x=>x.eq===s.value&&x.num!==a.num).length>=2){alert('A equipa já tem dois alunos.');route();return}a.eq=s.value;save();route()});
  $$('[data-del]').forEach(b=>b.onclick=()=>{if(D.entregas.some(x=>x.turmaId===t.id)){alert('Turma com entregas: composição bloqueada.');return}if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Confirmar';return}t.alunos=t.alunos.filter(x=>x.num!==b.dataset.del);save();route()});
  $('#del').onclick=()=>{const b=$('#del');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Confirmar: apagar tudo desta turma';return}
    D.entregas.filter(e=>e.turmaId===t.id).forEach(e=>delete D.fich[e.fid]);D.entregas=D.entregas.filter(e=>e.turmaId!==t.id);Object.keys(D.aval).forEach(k=>{if(k.startsWith(t.id+'|'))delete D.aval[k]});delete D.turmas[t.id];D.cur=null;save();location.hash='painel';route()}}

/* ======================= dados e privacidade ======================= */
function viewDados(m){let used=new TextEncoder().encode(JSON.stringify(D)).length;
  m.innerHTML=`<h1>Dados e privacidade</h1>
<div class="card"><h2>Onde ficam os dados</h2><p>Tudo o que veem nesta área (turmas, alunos, entregas, notas) fica guardado <b>só neste navegador, neste computador</b>. Não há servidor nem conta: a página é estática e nenhum dado sai do computador. Noutro computador ou noutro navegador a área aparece vazia.</p>
<ul><li>Se limparem os dados do navegador, perdem tudo o que não tiver cópia de segurança.</li><li>Usem esta área no vosso computador pessoal ou numa conta só vossa, não num computador partilhado da escola.</li><li>Os ficheiros de entrega dos alunos têm nomes e números: guardem-nos e apaguem-nos segundo as regras da escola.</li><li>Ocupação atual: ${(used/1024).toFixed(0)} KB (dados antes da cifra; quota depende do navegador).</li></ul></div>
<div class="g2"><div class="card"><h2>Cópia de segurança</h2><p>Descarreguem uma cópia no fim de cada período de entregas. A cópia é cifrada. Guarde-a e conserve a palavra-passe separadamente. Os ficheiros Excel e as entregas originais não são cifrados.</p><div class="row"><button id="bk">Descarregar cópia de segurança</button><label class="sec" style="border:1.5px solid var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:650">Restaurar cópia<input type="file" id="rs" accept=".json" class="hide"></label></div><p id="bm" class="small" role="status"></p></div>
<div class="card"><h2>Cofre cifrado</h2><p>AES-GCM e palavra-passe. A sessão bloqueia após 15 minutos sem atividade (se os dados estiverem guardados), ao bloquear manualmente ou ao fechar a página. Não é uma autenticação num servidor.</p><button id="locknow" class="sec">Bloquear área</button></div></div>
<div class="card"><h2>Antes de usar com alunos</h2><p>Os alunos são menores. Mesmo sem servidor, esta área trata dados pessoais (nomes, números e trabalho dos alunos). Antes de começarem:</p><ol><li>Informem a direção e o encarregado de proteção de dados da escola de como a área funciona.</li><li>Recolham só o necessário: o número basta para identificar; o nome é opcional nos ficheiros dos alunos.</li><li>Definam onde ficam os ficheiros de entrega e durante quanto tempo, e apaguem-nos no fim do ano letivo.</li><li>Se no futuro ligarem a área a um servidor (Supabase ou Firebase), isso exige autorização da escola, servidores na União Europeia, um contrato de tratamento de dados e informação aos encarregados de educação.</li></ol><p class="small">Esta lista é uma orientação prática e não substitui o parecer do encarregado de proteção de dados da escola.</p></div>
<div class="card"><h2>Endereço do SO Lab</h2><p class="small">Usado nas ligações para os alunos.</p><form class="row" id="bf"><input id="base" value="${esc(D.cfg.base)}" style="flex:1;min-width:280px" class="mono" aria-label="Endereço do SO Lab"><button>Guardar</button></form></div>
<div class="card"><h2>Apagar tudo</h2><p>Apaga todas as turmas, entregas e avaliações deste navegador.</p><button class="dng" id="wipe">Apagar todos os dados</button></div>`;
  $('#bk').onclick=async()=>{try{const box=await encrypt(D);const b=new Blob([JSON.stringify(box)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`proglab-teacher-copia-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);$('#bm').textContent='Cópia cifrada descarregada.'}catch(e){$('#bm').textContent='Não foi possível exportar a cópia.'}};
  $('#rs').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>80e6)throw Error('Cópia demasiado grande');const box=JSON.parse(await f.text());let next;if(box.formato==='proglab-teacher-vault'){const pw=prompt('Palavra-passe usada para cifrar esta cópia:');if(pw===null)return;next=validateBackup(await decrypt(box,await derive(pw,from64(box.salt))))}else if(box.formato==='proglab-teacher-backup'&&box.versao===1){next=validateBackup(box.dados,true)}else throw Error('Formato desconhecido');if(!confirm('Restaurar substitui os dados atuais. Já guardou uma cópia?'))return;await pending;await store('readwrite',await encrypt(next));D=next;location.hash='painel';route()}catch(x){$('#bm').textContent='Cópia não restaurada: palavra-passe, formato ou armazenamento inválido.'}};
  $('#locknow').onclick=async()=>{await pending;if(saveErr){alert(saveErr);return}location.reload()};
  $('#bf').onsubmit=e=>{e.preventDefault();D.cfg.base=safeBase($('#base').value.trim());save();route()};
  $('#wipe').onclick=()=>{const b=$('#wipe');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Confirmar: apagar todos os dados';return}D={v:1,turmas:{},entregas:[],fich:{},aval:{},cur:null,cfg:{base:D.cfg.base,pin:null}};save();location.hash='';route()}}

/* ======================= dados de demonstração ======================= */
function demo(){const NOMES=['Ana Martins','Bruno Costa','Carla Sousa','Diogo Lopes','Eva Ferreira','Filipe Rocha','Gabriela Nunes','Hugo Pinto','Inês Carvalho','João Ribeiro','Lara Mendes','Miguel Santos','Nádia Faria','Óscar Teixeira','Patrícia Reis','Rui Gomes'];
  const t={id:uid(),nome:'Demonstração (dados fictícios)',disc:'SO',code:PL.gen(),nEq:8,alunos:NOMES.map((n,i)=>({num:String(i+1),nome:n,eq:pad(Math.floor(i/2)+1)})),atrib:{LAB01:{prazo:'2026-10-16'},LAB02:{prazo:'2026-11-06'},LAB03:{prazo:'2026-11-27'}},criadoEm:new Date().toISOString(),demo:true};
  D.turmas[t.id]=t;D.cur=t.id;
  const plan={'01':[1,1,1],'02':[1,1,1],'03':[1,1,0],'04':[1,1,1],'05':[1,0,0],'06':[1,1,1],'07':[1,1,0],'08':[1,1,1]};
  const grades={'01':[17,18,18],'02':[15,16,16],'03':[13,14,null],'04':[16,17,null],'05':[11,null,null],'06':[16,15,17],'07':[14,null,null],'08':[18,17,19]};
  const days=['2026-10-14','2026-11-05','2026-11-24'],K=['LAB01','LAB02','LAB03'];
  Object.entries(plan).forEach(([q,p])=>p.forEach((has,i)=>{if(!has)return;const g=grades[q][i];const r=g?Math.min(1,g/20+.03):.7;const al=t.alunos.filter(a=>a.eq===q).map(a=>({num:a.num,nome:a.nome}));
    const gen=`${days[i]}T${10+(+q%5)}:${pad(+q*7%60)}:00.000Z`;
    const dados=cleanLab({id:K[i],titulo:labName(t,K[i]),estado:r>.75?'concluido':'em_curso',componentes:[{nome:i===0?'Verificações no firmware':i===1?'VM criada e arrancada':'Requisitos do cliente cumpridos',valor:Math.min(1,r+.05),detalhe:'dados fictícios'},{nome:'Respostas escritas completas',valor:Math.max(0,r-.08),detalhe:'dados fictícios'}],
      missoes:[{t:'Exemplo de missão concluída',ok:true},{t:'Exemplo de segunda missão',ok:r>.8}],respostas:[{p:'Pergunta de exemplo',r:'Resposta fictícia da equipa '+q+' para mostrar como a área apresenta as respostas escritas dos alunos.'}],
      comandos:i===2?[{onde:'Ubuntu',c:'lsblk'},{onde:'Ubuntu',c:'df -h'},{onde:'Ubuntu',c:'sudo apt update'}]:[],acoes:['10:02 Exemplo de ação registada'],tentativas:3,errosComando:+q%3});
    const e={id:uid(),turmaId:t.id,eq:q,lab:K[i],app:'bancada',plataforma:'SO Lab · Bancada',titulo:dados.titulo,recebidoEm:gen,geradoEm:gen,ficheiro:`entrega-SO-bancada-eq${q}-demo.json`,fid:'',alunos:al,seloOk:true,avisos:[],dados};
    D.entregas.push(e);if(g)D.aval[AK(t,q,K[i])]={nota:g,ind:{},feedback:'Feedback de exemplo.',em:gen,entregaId:e.id}}));
  save()}

startVault();
</script>
