<style>

<footer>ProgLab Teacher · Os dados ficam cifrados e só neste navegador, neste computador. Nada é enviado para servidores. Façam cópias de segurança regularmente em «Dados e privacidade». · Alexandra Silva @ 2026</footer>
<script>
/* ===== ProgLab · entrega à professora (comum a todas as plataformas) =====
   Sem servidor: gera um ficheiro .json que os alunos entregam (Classroom, Teams, pen).
   O código de turma e os prazos ficam guardados neste navegador e são partilhados
   por todas as páginas do mesmo site. */
const PL=(()=>{
  const ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',SK='proglab-turma-v1';
  const clean=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const chk=s=>{let t=0;for(let i=0;i<s.length;i++)t+=(ABC.indexOf(s[i])+1)*(i+3);return ABC[t%32]};
  const valid=c=>{const s=clean(c);return s.length===6&&[...s].every(x=>ABC.includes(x))&&chk(s.slice(0,5))===s[5]};
  const fmt=c=>{const s=clean(c);return s.length>3?s.slice(0,3)+'-'+s.slice(3):s};
  const cyrb=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')};
  const seal=(o,code)=>cyrb(JSON.stringify(o)+'|'+clean(code),0x50524f47);
  let st={code:'',prazos:{}};
  try{const r=JSON.parse(localStorage.getItem(SK)||'null');if(r)st={code:r.code||'',prazos:r.prazos||{}}}catch(e){}
  const keep=()=>{try{localStorage.setItem(SK,JSON.stringify(st))}catch(e){}};
  /* ligação da professora: ?turma=ABC-DEF&p=W5.2026-12-10~L5.2027-01-15 */
  try{const q=new URLSearchParams(location.search);const t=q.get('turma');
    if(t&&valid(t)){if(clean(t)!==clean(st.code))st.prazos={};st.code=fmt(t)}
    const p=q.get('p');if(p&&t&&valid(t)){st.prazos={};p.split('~').forEach(x=>{const m=x.match(/^([A-Za-z0-9-]+)\.(\d{4}-\d{2}-\d{2})$/);if(m)st.prazos[m[1].toUpperCase()]=m[2]})}
    if(t)keep()}catch(e){}
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dpt=d=>{const[y,m,dd]=d.split('-');return `${dd}/${m}/${y}`};
  const css=`.pl-box{border:2px solid #11161d;border-radius:12px;padding:16px 18px;margin:0 0 20px;background:#fff;color:#11161d;font:inherit;max-width:820px}
.pl-box h3{margin:0 0 4px;font-size:1.1rem}.pl-box p{margin:6px 0}.pl-box .pl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.pl-box input{font:inherit;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;border:1.5px solid #5b6470;border-radius:8px;width:9.5em}
.pl-box button{font:inherit;font-weight:700;padding:9px 16px;border-radius:8px;border:0;background:#11161d;color:#fff;cursor:pointer}
.pl-box button:disabled{opacity:.45;cursor:not-allowed}.pl-box .pl-ok{color:#0b7a3b;font-weight:600}.pl-box .pl-bad{color:#b3261e;font-weight:600}
.pl-box .pl-msg{min-height:1.3em}.pl-box ul{margin:6px 0 0;padding-left:20px}.pl-box .pl-late{color:#b3261e;font-weight:600}.pl-box small{color:#5b6470}`;
  function panel(el,cfg){
    if(!document.getElementById('pl-css')){const s=document.createElement('style');s.id='pl-css';s.textContent=css;document.head.append(s)}
    const draw=()=>{
      const ok=valid(st.code);const ids=cfg.labIds();const today=new Date().toISOString().slice(0,10);
      const pz=ids.filter(id=>st.prazos[id]).map(id=>`<li>${esc(cfg.labName(id))}: até ${dpt(st.prazos[id])}${st.prazos[id]<today?' <span class="pl-late">(prazo ultrapassado)</span>':''}</li>`).join('');
      el.innerHTML=`<div class="pl-box" role="region" aria-label="Entrega à professora"><h3>Entregar à professora</h3>
<p>Descarreguem o ficheiro de entrega e enviem-no à professora pelo canal combinado (Classroom, Teams ou pen). Podem entregar várias vezes: fica a versão mais recente.</p>
<div class="pl-row"><label for="pl-code"><b>Código de turma</b></label><input id="pl-code" value="${esc(st.code)}" maxlength="7" autocomplete="off" spellcheck="false" placeholder="ABC-DEF"><span id="pl-cs" class="${ok?'pl-ok':st.code?'pl-bad':''}">${ok?'Código válido':st.code?'Código inválido: confirmem com a professora':''}</span></div>
${pz?`<p style="margin-top:10px"><b>Prazos</b></p><ul>${pz}</ul>`:''}
<div class="pl-row"><button id="pl-dl" ${ok?'':'disabled'}>Descarregar ficheiro de entrega</button><span class="pl-msg" id="pl-msg"></span></div>
<p><small>O ficheiro tem os vossos nomes, números e o trabalho feito nesta página. Não é enviado para nenhum servidor.</small></p></div>`;
      const inp=el.querySelector('#pl-code');
      inp.oninput=()=>{const v=fmt(inp.value);if(clean(v)!==clean(st.code))st.prazos={};st.code=v;keep();const cs=el.querySelector('#pl-cs');const k=valid(v);cs.className=k?'pl-ok':v?'pl-bad':'';cs.textContent=k?'Código válido':clean(v).length<6?'':'Código inválido: confirmem com a professora';el.querySelector('#pl-dl').disabled=!k;cfg.onCode&&cfg.onCode(st.code)};
      inp.onblur=()=>{inp.value=st.code};
      el.querySelector('#pl-dl').onclick=()=>{const msg=el.querySelector('#pl-msg');const prob=cfg.check?cfg.check():null;if(prob){msg.className='pl-msg pl-bad';msg.textContent=prob;return}
        const b=cfg.build();const body={formato:'proglab-entrega',versao:1,disciplina:cfg.disciplina,plataforma:cfg.plataforma,app:cfg.app,turma:fmt(st.code),equipa:b.equipa,alunos:b.alunos,geradoEm:new Date().toISOString(),labs:b.labs.filter(l=>l.estado!=='por_iniciar'),relatorio:b.relatorio||''};
        if(!body.labs.length){msg.className='pl-msg pl-bad';msg.textContent='Ainda não há trabalho para entregar nesta página.';return}
        const file={...body,selo:seal(body,st.code)};
        const nums=b.alunos.map(a=>a.num).filter(Boolean).join('-').replace(/[^\w-]+/g,'')||'alunos';
        const name=`entrega-${cfg.disciplina}-${cfg.app}-eq${b.equipa}-${nums}-${body.geradoEm.slice(0,10)}.json`;
        try{const u=URL.createObjectURL(new Blob([JSON.stringify(file,null,1)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
          msg.className='pl-msg pl-ok';msg.textContent=`Ficheiro «${name}» criado com ${body.labs.length} laboratório${body.labs.length>1?'s':''}. Enviem-no à professora.`}catch(e){msg.className='pl-msg pl-bad';msg.textContent='O navegador bloqueou a transferência. Experimentem outro navegador.'}};
    };
    draw();return{redraw:draw}}
  /* utilitários para os adaptadores */
  const errs=tx=>(tx||[]).filter(o=>o&&o.e).length;
  const qscore=(n,ans,att)=>{let s=0;for(let j=0;j<n;j++)if(ans[j]===0)s+=att&&att[j]?0.5:1;return n?s/n:0};
  const gen=()=>{const a=new Uint32Array(5);crypto.getRandomValues(a);let s='';a.forEach(x=>s+=ABC[x%32]);return fmt(s+chk(s))};
  return{panel,valid,fmt,gen,clean,cyrb,code:()=>st.code,setCode:c=>{const v=fmt(c);if(clean(v)!==clean(st.code))st.prazos={};st.code=v;keep()},prazos:()=>st.prazos,errs,qscore,seal}
})();

/* ======================= dados e catálogo ======================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SITE='https://profalexandrapsilva-proglab.github.io/LAB_SO/';
const REV=['Hardware e sistema operativo','Firmware e arranque','Instalação do sistema operativo','Discos, partições e sistemas de ficheiros','Periféricos e controladores','Processos, memória e desempenho','Utilizadores, grupos e permissões','Partilha de recursos e ficheiros','Rede e diagnóstico','Virtualização e recuperação','Software complementar: escolha e licenças','Instalação e configuração de aplicações','Atualizações e manutenção','Cópias de segurança e imagens de restauro','Segurança: antivírus e firewall','Projeto final de manutenção'];
const CAT={
  SO:{nome:'Sistemas Operativos',curto:'SO',onde:'SO Lab',plataformas:[
    {app:'bancada',nome:'Bancada',path:'bancada/index.html',labs:[['LAB01','Lab 01 · Interpretar o equipamento'],['LAB02','Lab 02 · Planear e criar a máquina virtual'],['LAB03','Lab 03 · Instalar o Ubuntu'],['BUBU','Bancada · Terminal Ubuntu'],['BWIN','Bancada · Terminal Windows']]},
    {app:'trilhos',nome:'Trilhos',path:'index.html',labs:[['W5','W5 · Contas, UAC e permissões NTFS'],['L5','L5 · Utilizadores, grupos e permissões']]},
    {app:'revisao',nome:'Revisão',path:'revisao/index.html',labs:REV.map((t,i)=>['R'+String(i+1).padStart(2,'0'),`Revisão ${i+1} · ${t}`])}]},
  CPP:{nome:'Programação (algoritmos e C++)',curto:'Programação',onde:'Laboratório de Programação',plataformas:[
  {app:'proglab',nome:'Laboratório de Programação',url:'https://profalexandrapsilva-proglab.github.io/laboratorio-de-programacao/',labs:[['P245-SEQ','UC00245 · Sequência'],['P245-DEC','UC00245 · Decisão'],['P245-REP','UC00245 · Repetição'],['P606-SEQ','UC00606 · Sequência e operadores'],['P606-DEC','UC00606 · Decisão'],['P606-REP','UC00606 · Repetição'],['P607-VET','UC00607 · Vetores'],['P607-STR','UC00607 · Strings'],['P607-MAT','UC00607 · Matrizes'],['P607-EST','UC00607 · Estruturas (struct)'],['P607-APT','UC00607 · Funções e apontadores'],['P607-FIC','UC00607 · Ficheiros']]}]},
  POO:{nome:'Programação Orientada a Objetos (Java)',curto:'Java POO',brevemente:true,plataformas:[]},
  BD:{nome:'Bases de Dados',curto:'BD',brevemente:true,plataformas:[]}};
/* ======================= cofre cifrado =======================
   Os dados só existem cifrados no navegador (AES-GCM 256, chave derivada da
   palavra-passe com PBKDF2-SHA-256, 600 000 iterações). A chave fica só em memória. */
const VK='proglab-teacher-vault-v1',OLD='proglab-teacher-v1',FK='proglab-teacher-tentativas',ITER=600000,MINPW=12,IDLE=15*60*1000;
const blank=()=>({v:1,turmas:{},entregas:[],fich:{},aval:{},cur:null,cfg:{base:SITE}});
let D=null,KEY=null,saveErr='',chain=Promise.resolve();
const b64=u=>{let s='';u=new Uint8Array(u);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt,it){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(obj,key,salt,it){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return{v:1,kdf:'PBKDF2-SHA-256',it,salt:b64(salt),iv:b64(iv),ct:b64(ct)}}
async function open_(box,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.ct));return JSON.parse(new TextDecoder().decode(pt))}
function vault(){try{return JSON.parse(localStorage.getItem(VK)||'null')}catch(e){return null}}
/* ======================= ficheiro sincronizado (OneDrive) =======================
   O cofre cifrado é gravado também num ficheiro escolhido pela professora (por exemplo, na pasta
   OneDrive da escola, que o próprio OneDrive sincroniza). Usa a File System Access API (Edge e Chrome).
   O ficheiro tem o formato das cópias de segurança cifradas: sem a palavra-passe ninguém o lê. */
const OD=(()=>{const DB='proglab-teacher-ficheiros',STO='h';
  const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STO);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const get=async k=>{try{const db=await idb();return await new Promise(r=>{const q=db.transaction(STO).objectStore(STO).get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}};
  const put=async(k,v)=>{try{const db=await idb();await new Promise(r=>{const t=db.transaction(STO,'readwrite');v==null?t.objectStore(STO).delete(k):t.objectStore(STO).put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}};
  const ok='showSaveFilePicker' in window&&'showDirectoryPicker' in window&&window.self===window.top;
  const st={file:null,dir:null,estado:'',quando:null,erro:''};
  const perm=async(h,mode,ask)=>{if(!h)return false;const o={mode};try{if(await h.queryPermission(o)==='granted')return true;if(!ask)return false;return(await h.requestPermission(o))==='granted'}catch(e){return false}};

function catLabs(disc){const c=CAT[disc];return c?c.plataformas.flatMap(p=>p.labs.map(([k,n])=>({k,n,app:p.app,plat:p.nome}))):[]}
function labName(t,k){const c=catLabs(t.disc).find(x=>x.k===k);if(c)return c.n;const e=D.entregas.find(x=>x.turmaId===t.id&&x.lab===k);return e?e.titulo:k}

function labsInUse(t){const a=assigned(t);if(a.length)return a;const seen=[];catLabs(t.disc).forEach(x=>{if(D.entregas.some(e=>e.turmaId===t.id&&e.lab===x.k))seen.push(x.k)});D.entregas.forEach(e=>{if(e.turmaId===t.id&&!seen.includes(e.lab))seen.push(e.lab)});return seen}

const AK=(t,q,k)=>t.id+'|'+q+'|'+k;

function lock(){$('#tabs').innerHTML='';$('#disc').innerHTML='';$('#tsel').classList.add('hide');$('#lockbtn').classList.add('hide');

    localStorage.setItem(VK,JSON.stringify(j.cofre));await OD.setFile(h);OD.st.estado=(await OD.perm(h,'readwrite',true))?'ok':'pausa';lock()}catch(x){if(x&&x.name!=='AbortError')$('#odm').textContent='Não foi possível abrir o ficheiro.'}};
    $('#pw1').focus();$('#lk').onsubmit=async e=>{e.preventDefault();const a=$('#pw1').value,b=$('#pw2').value,pr=pwProblem(a);if(pr){$('#lkm').textContent=pr;return}if(a!==b){$('#lkm').textContent='As palavras-passe não coincidem.';return}
      $('#lkm').textContent='A criar o cofre…';const salt=crypto.getRandomValues(new Uint8Array(16));KEY={key:await derive(a,salt,ITER),salt,it:ITER};
      D=blank();let old=null;try{old=JSON.parse(localStorage.getItem(OLD)||'null')}catch(x){}if(old&&old.turmas){D=Object.assign(blank(),old);delete D.cfg.pin}
      save();await chain;if(vault()){try{localStorage.removeItem(OLD)}catch(x){}}sessionStorage.removeItem('proglab-unlock');poke();location.hash=Object.keys(D.turmas).length?'painel':'nova';route()};return}
  $('#main').innerHTML=`<div class="lock"><h1>Área da professora</h1>${lockMsg?`<p class="note info">${esc(lockMsg)}</p>`:''}<p class="small">Introduzam a palavra-passe do cofre.</p>
<form id="lk"><div class="fld"><label for="pw">Palavra-passe</label><input id="pw" type="password" autocomplete="current-password" required></div><button id="lkb"${wait?' disabled':''}>Abrir</button> <span id="lkm" class="small" role="status">${wait?`Demasiadas tentativas: esperem ${wait} s.`:''}</span></form>

async function restoreFile(e,msg){const f=e.target.files[0];e.target.value='';if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(x){msg.textContent='Este ficheiro não é uma cópia de segurança do ProgLab Teacher.';return}

const S=(v,n=20000)=>String(v??'').slice(0,n);
const A=(v,n)=>Array.isArray(v)?v.slice(0,n):[];
function cleanLab(l){return{id:S(l.id,20).toUpperCase(),titulo:S(l.titulo,200),estado:['concluido','em_curso','por_iniciar'].includes(l.estado)?l.estado:'em_curso',concluidoEm:S(l.concluidoEm,40),
  fases:A(l.fases,20).map(x=>({nome:S(x&&x.nome,80),ok:!!(x&&x.ok)})),
  componentes:A(l.componentes,12).map(x=>({nome:S(x&&x.nome,120),valor:Math.max(0,Math.min(1,+(x&&x.valor)||0)),detalhe:S(x&&x.detalhe,80)})),
  missoes:A(l.missoes,60).map(x=>({t:S(x&&x.t,300),ok:!!(x&&x.ok),opt:!!(x&&x.opt)})),
  perguntas:A(l.perguntas,40).map(x=>({p:S(x&&x.p,400),ok:!!(x&&x.ok),respondida:!!(x&&x.respondida),erros:Math.max(0,+(x&&x.erros)||0)})),
  respostas:A(l.respostas,20).map(x=>({p:S(x&&x.p,500),r:S(x&&x.r,20000)})),
  comandos:A(l.comandos,3000).map(x=>typeof x==='string'?{onde:'',c:S(x,500)}:{onde:S(x&&x.onde,30),c:S(x&&x.c,500)}),
  acoes:A(l.acoes,1500).map(x=>S(x,300)),tentativas:Math.max(0,+l.tentativas||0),errosComando:Math.max(0,+l.errosComando||0)}}
async function importFiles(files){const out=[];
  for(const f of files){
    if(f.size>3e6){out.push(['bad',f.name,'Ficheiro demasiado grande (máx. 3 MB).']);continue}
    let j;try{j=JSON.parse(await f.text())}catch(e){out.push(['bad',f.name,'Não é um ficheiro de entrega válido (JSON ilegível).']);continue}
    if(!j||j.formato!=='proglab-entrega'){out.push(['bad',f.name,/^proglab-teacher-backup/.test(j&&j.formato||'')?'Isto é uma cópia de segurança: restaurem-na em «Dados e privacidade».':'Não é um ficheiro de entrega ProgLab.']);continue}
    const t=Object.values(D.turmas).find(x=>PL.clean(x.code)===PL.clean(j.turma));
    if(!t){out.push(['bad',f.name,`O código de turma «${esc(S(j.turma,12))}» não corresponde a nenhuma turma desta área.`]);continue}
    if(j.disciplina!==t.disc){out.push(['bad',f.name,`A entrega é de ${esc(S(j.disciplina,10))}, mas a turma «${esc(t.nome)}» é de ${esc(t.disc)}.`]);continue}
    const {selo,...body}=j;const seloOk=PL.seal(body,j.turma)===selo;
    const alunos=A(j.alunos,4).map(a=>({num:nk(S(a&&a.num,10)),nome:S(a&&a.nome,80)}));
    const hit=alunos.map(a=>t.alunos.find(r=>nk(r.num)===a.num)).filter(Boolean);
    const eqR=[...new Set(hit.map(r=>r.eq).filter(Boolean))];
    let eq=eqR.length===1?eqR[0]:null;const fe=/^\d{1,2}$/.test(S(j.equipa,4))?pad(+j.equipa):'';const warn=[];
    if(eqR.length>1)warn.push(`os alunos estão registados em equipas diferentes (${eqR.join(' e ')}); usada a equipa ${eqR[0]}`),eq=eqR[0];
    if(!eq){if(fe&&+fe<=t.nEq){eq=fe;if(t.alunos.length)warn.push('alunos não encontrados na turma: usada a equipa indicada no ficheiro')}else{out.push(['bad',f.name,'Não foi possível identificar a equipa: registem os números destes alunos em «Turma e equipas».']);continue}}
    else if(fe&&fe!==eq)warn.push(`o ficheiro indica a equipa ${fe}, a turma regista a equipa ${eq}`);
    if(hit.length<alunos.filter(a=>a.num).length&&eqR.length)warn.push('um dos números não está registado na turma');
    if(!seloOk)warn.push('selo inválido: o ficheiro foi alterado depois de descarregado');
    const fid=uid();let n=0,dup=0;
    A(j.labs,40).forEach(l0=>{const l=cleanLab(l0||{});if(!l.id||l.estado==='por_iniciar')return;
      const g=S(j.geradoEm,40);if(D.entregas.some(e=>e.turmaId===t.id&&e.eq===eq&&e.lab===l.id&&e.geradoEm===g)){dup++;return}
      D.entregas.push({id:uid(),turmaId:t.id,eq,lab:l.id,app:S(j.app,20),plataforma:S(j.plataforma,60),titulo:l.titulo||l.id,recebidoEm:new Date().toISOString(),geradoEm:g,ficheiro:S(f.name,160),fid,alunos,seloOk,avisos:warn.slice(),dados:l});n++});
    if(n)D.fich[fid]={relatorio:S(j.relatorio,200000)};
    out.push([n?(warn.length?'warn':'ok'):'warn',f.name,`${esc(t.nome)} · equipa ${eq}: ${n} laboratório${n!==1?'s':''} importado${n!==1?'s':''}${dup?`, ${dup} já existia${dup>1?'m':''}`:''}${warn.length?' · Atenção: '+esc(warn.join('; ')):''}`]);
  }
  save();return out}

/* xlsx mínimo, sem bibliotecas: ZIP sem compressão com SpreadsheetML */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}})();

    parts.push(h.buffer,nb,db);const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,db.length,true);c.setUint32(24,db.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);cd.push(c.buffer,nb);off+=30+nb.length+db.length});

<div class="row"><button type="button" id="odlink">${OD.st.file?'Escolher outro ficheiro':'Ligar a um ficheiro no OneDrive'}</button>${OD.st.file&&OD.st.estado!=='ok'?'<button type="button" class="sec" id="odres2">Retomar a gravação</button>':''}${OD.st.file?'<button type="button" class="lnk" id="odoff">Desligar</button>':''}</div>
<p class="small">Na janela que se abre, escolham a pasta OneDrive (por exemplo «OneDrive - Escola › ProgLab») e mantenham o nome sugerido. Depois de recarregarem a página, o navegador volta a pedir autorização para gravar.</p>`:'<p class="small">Esta função precisa do Microsoft Edge ou do Google Chrome no computador. Neste navegador, usem as cópias de segurança abaixo e guardem-nas na pasta OneDrive.</p>'}</div>
<div class="g2"><div class="card"><h2>Cópia de segurança</h2><p>Descarreguem uma cópia no fim de cada período de entregas. A cópia fica <b>cifrada com a palavra-passe atual</b>: para a restaurar, é precisa essa palavra-passe.</p><div class="row"><button id="bk">Descarregar cópia de segurança</button><label class="sec" style="border:1.5px solid var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:650">Restaurar cópia<input type="file" id="rs" accept=".json" class="hide"></label></div><p id="bm" class="small" role="status"></p></div>
<div class="card"><h2>Segurança do cofre</h2><ul><li>Os dados estão cifrados (AES-256) com a vossa palavra-passe. Sem ela ninguém os consegue ler, nem vocês.</li><li>A área bloqueia ao fim de 15 minutos sem atividade, ao recarregar a página e no botão «Bloquear».</li><li>Depois de 5 tentativas erradas, a entrada fica suspensa durante algum tempo.</li><li>A página não comunica com nenhum servidor: a política de segurança do navegador bloqueia qualquer envio de dados.</li></ul>
<form id="cpf"><h3>Mudar a palavra-passe</h3><div class="fld"><label for="cp0">Palavra-passe atual</label><input id="cp0" type="password" autocomplete="current-password" required></div><div class="fld"><label for="cp1">Nova palavra-passe</label><input id="cp1" type="password" autocomplete="new-password" required minlength="12"></div><div class="fld"><label for="cp2">Repetir a nova</label><input id="cp2" type="password" autocomplete="new-password" required></div><button>Mudar a palavra-passe</button> <span id="pm" class="small" role="status"></span></form></div></div>
<div class="card"><h2>Antes de usar com alunos</h2><p>Os alunos são menores. Mesmo sem servidor, esta área trata dados pessoais (nomes, números e trabalho dos alunos). Antes de começarem:</p><ol><li>Informem a direção e o encarregado de proteção de dados da escola de como a área funciona.</li><li>Recolham só o necessário: o número basta para identificar; o nome é opcional nos ficheiros dos alunos.</li><li>Definam onde ficam os ficheiros de entrega e durante quanto tempo, e apaguem-nos no fim do ano letivo.</li><li>Se no futuro ligarem a área a um servidor (Supabase ou Firebase), isso exige autorização da escola, servidores na União Europeia, um contrato de tratamento de dados e informação aos encarregados de educação.</li></ol><p class="small">Esta lista é uma orientação prática e não substitui o parecer do encarregado de proteção de dados da escola.</p></div>
<div class="card"><h2>Endereço do SO Lab</h2><p class="small">Usado nas ligações para os alunos.</p><form class="row" id="bf"><input id="base" value="${esc(D.cfg.base)}" style="flex:1;min-width:280px" class="mono" aria-label="Endereço do SO Lab"><button>Guardar</button></form></div>
<div class="card"><h2>Apagar tudo</h2><p>Apaga todas as turmas, entregas e avaliações deste navegador.</p><button class="dng" id="wipe">Apagar todos os dados</button></div>`;
  const odl=$('#odlink');if(odl)odl.onclick=async()=>{try{const h=await showSaveFilePicker({suggestedName:'ProgLab-Teacher-cofre.json',types:[{description:'Cofre ProgLab Teacher',accept:{'application/json':['.json']}}]});await OD.setFile(h);const box=vault();if(box)await OD.write(box);viewDados(m)}catch(x){if(x&&x.name!=='AbortError')alert('Não foi possível ligar ao ficheiro.')}};
  const odr2=$('#odres2');if(odr2)odr2.onclick=async()=>{await odResume();viewDados(m)};
  const odo=$('#odoff');if(odo)odo.onclick=async()=>{await OD.setFile(null);viewDados(m)};
  $('#bk').onclick=async()=>{const box=await seal(D,KEY.key,KEY.salt,KEY.it);const b=new Blob([JSON.stringify({formato:'proglab-teacher-backup-cifrada',versao:1,criadoEm:new Date().toISOString(),cofre:box})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`proglab-teacher-copia-cifrada-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);$('#bm').textContent='Cópia cifrada descarregada.'};
  $('#rs').onchange=e=>restoreFile(e,$('#bm'));
  $('#cpf').onsubmit=async e=>{e.preventDefault();const p0=$('#cp0').value,p1=$('#cp1').value,p2=$('#cp2').value;
    try{await open_(vault(),await derive(p0,KEY.salt,KEY.it))}catch(x){$('#pm').textContent='A palavra-passe atual está errada.';return}
    const pr=pwProblem(p1);if(pr){$('#pm').textContent=pr;return}if(p1!==p2){$('#pm').textContent='As novas palavras-passe não coincidem.';return}
    $('#pm').textContent='A cifrar com a nova palavra-passe…';const salt=crypto.getRandomValues(new Uint8Array(16));KEY={key:await derive(p1,salt,ITER),salt,it:ITER};save();await chain;$('#pm').textContent='Palavra-passe alterada. As cópias antigas continuam a abrir com a palavra-passe antiga.';$$('#cpf input').forEach(i=>i.value='')};
  $('#bf').onsubmit=e=>{e.preventDefault();D.cfg.base=$('#base').value.trim()||SITE;save();route()};
  $('#wipe').onclick=()=>{const b=$('#wipe');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Confirmar: apagar todos os dados';return}D=blank();save();location.hash='nova';route()}}
