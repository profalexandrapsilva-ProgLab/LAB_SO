<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>ProgLab Teacher · Área da professora</title>
<style>
:root{--ink:#11161d;--mut:#5b6470;--line:#d9dde3;--bg:#f5f6f8;--card:#fff;--red:#e6261f;--blue:#0a5cff;--yel:#ffb400;--ok:#0b7a3b;--okb:#e3f4ea;--warn:#8a5a00;--warnb:#fff3d6;--bad:#b3261e;--badb:#fde7e5;--infob:#e8efff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;font-weight:650;background:var(--ink);color:#fff}
button.sec{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
button.lnk{background:none;color:var(--blue);padding:0;font-weight:600;text-decoration:underline}
button.dng{background:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
input,select,textarea{border:1.5px solid #aab1ba;border-radius:8px;padding:7px 9px;background:#fff}
textarea{width:100%;min-height:110px;resize:vertical}
label{font-weight:600}
.top{background:var(--ink);color:#fff;padding:10px 22px;display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;margin-right:auto}
.brand b{font-size:1.15rem;letter-spacing:.01em}.brand span{display:block;font-size:.8rem;color:#c5cbd3}
.disc{display:flex;gap:6px;flex-wrap:wrap}
.disc span{font-size:.78rem;padding:3px 9px;border-radius:99px;border:1px solid #4a525d;color:#c5cbd3}
.disc span.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.top select{background:#232b35;color:#fff;border-color:#4a525d;max-width:260px}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 22px;display:flex;gap:4px;overflow-x:auto}
nav.tabs a{padding:12px 12px 10px;text-decoration:none;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-color:var(--red)}
main{max-width:1180px;margin:0 auto;padding:24px 22px 60px}
h1{font-size:1.55rem;margin:0 0 4px}h2{font-size:1.15rem;margin:0 0 12px}h3{font-size:1rem;margin:18px 0 8px}
.lead{color:var(--mut);margin:0 0 20px;max-width:75ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.kpi .l{color:var(--mut);font-size:.85rem;font-weight:600}.kpi .v{font-size:1.9rem;font-weight:750;line-height:1.2;font-variant-numeric:tabular-nums}.kpi .s{font-size:.8rem;color:var(--mut)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px}
@media(max-width:860px){.g2{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:92px 1fr 48px;gap:10px;align-items:center;margin:9px 0}
.bar .t{height:12px;background:#eceef1;border-radius:99px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar .t i.full{background:var(--ok)}.bar b{font-variant-numeric:tabular-nums;text-align:right}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:#f3f6ff}
.tw{overflow-x:auto}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--okb);color:var(--ok)}.p-warn{background:var(--warnb);color:var(--warn)}.p-bad{background:var(--badb);color:var(--bad)}.p-info{background:var(--infob);color:var(--blue)}.p-mut{background:#eceef1;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.small{font-size:.85rem;color:var(--mut)}
.code{font:700 1.6rem/1.2 ui-monospace,Consolas,monospace;letter-spacing:.12em;background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;display:inline-block}
.drop{border:2.5px dashed #aab1ba;border-radius:14px;padding:28px;text-align:center;background:#fff}
.drop.over{border-color:var(--blue);background:var(--infob)}
.log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
pre,.mono{font:13px/1.45 ui-monospace,Consolas,monospace}
pre{background:#11161d;color:#e8eaed;padding:12px 14px;border-radius:10px;overflow:auto;max-height:340px;white-space:pre-wrap;margin:0}
ol.cmds{font:13px/1.5 ui-monospace,Consolas,monospace;background:#11161d;color:#e8eaed;padding:12px 14px 12px 52px;border-radius:10px;max-height:340px;overflow:auto;margin:0}
ol.cmds span{color:#8fb4ff}
.ans{white-space:pre-wrap;background:#f7f8fa;border-left:4px solid var(--blue);padding:10px 14px;border-radius:0 8px 8px 0;margin:4px 0 12px}
.ans.empty{border-color:var(--bad);color:var(--mut);font-style:italic}
ul.chk{list-style:none;padding:0;margin:0}ul.chk li{padding:3px 0 3px 26px;position:relative}
ul.chk li:before{content:"✗";position:absolute;left:4px;color:var(--bad);font-weight:700}ul.chk li.ok:before{content:"✓";color:var(--ok)}
.note{background:var(--warnb);border-radius:10px;padding:10px 14px;margin:0 0 16px}
.note.info{background:var(--infob)}.note.bad{background:var(--badb)}
.hide{display:none!important}
.big{font-size:2.4rem;font-weight:750}
.lock{max-width:380px;margin:12vh auto;background:#fff;border-radius:16px;padding:28px;border:1px solid var(--line)}
footer{max-width:1180px;margin:0 auto;padding:0 22px 30px;color:var(--mut);font-size:.82rem}
@media print{.top,nav.tabs,footer,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}}
</style>
</head>

<script>
/* ===== ProgLab · entrega à professora (comum a todas as plataformas) =====
   Sem servidor: gera um ficheiro .json que os alunos entregam (Classroom, Teams, pen).
   O código de turma e os prazos ficam guardados neste navegador e são partilhados
   por todas as páginas do mesmo site. */
const PL=(()=>{
  const ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',SK='proglab-turma-v1';
  const clean=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const chk=s=>{let t=0;for(let i=0;i<s.length;i++)t+=(ABC.indexOf(s[i])+1)*(i+3);return ABC[t%32]};
  const valid=c=>{const s=clean(c);return s.length===6&&[...s].every(x=>ABC.includes(x))&&chk(s.slice(0,5))===s[5]};
  const fmt=c=>{const s=clean(c);return s.length>3?s.slice(0,3)+'-'+s.slice(3):s};
  const cyrb=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')};
  const seal=(o,code)=>cyrb(JSON.stringify(o)+'|'+clean(code),0x50524f47);
  let st={code:'',prazos:{}};
  try{const r=JSON.parse(localStorage.getItem(SK)||'null');if(r)st={code:r.code||'',prazos:r.prazos||{}}}catch(e){}
  const keep=()=>{try{localStorage.setItem(SK,JSON.stringify(st))}catch(e){}};
  /* ligação da professora: ?turma=ABC-DEF&p=W5.2026-12-10~L5.2027-01-15 */
  try{const q=new URLSearchParams(location.search);const t=q.get('turma');
    if(t&&valid(t)){if(clean(t)!==clean(st.code))st.prazos={};st.code=fmt(t)}
    const p=q.get('p');if(p&&t&&valid(t)){st.prazos={};p.split('~').forEach(x=>{const m=x.match(/^([A-Za-z0-9-]+)\.(\d{4}-\d{2}-\d{2})$/);if(m)st.prazos[m[1].toUpperCase()]=m[2]})}
    if(t)keep()}catch(e){}
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dpt=d=>{const[y,m,dd]=d.split('-');return `${dd}/${m}/${y}`};
  const css=`.pl-box{border:2px solid #11161d;border-radius:12px;padding:16px 18px;margin:0 0 20px;background:#fff;color:#11161d;font:inherit;max-width:820px}
.pl-box h3{margin:0 0 4px;font-size:1.1rem}.pl-box p{margin:6px 0}.pl-box .pl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.pl-box input{font:inherit;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;border:1.5px solid #5b6470;border-radius:8px;width:9.5em}
.pl-box button{font:inherit;font-weight:700;padding:9px 16px;border-radius:8px;border:0;background:#11161d;color:#fff;cursor:pointer}
.pl-box button:disabled{opacity:.45;cursor:not-allowed}.pl-box .pl-ok{color:#0b7a3b;font-weight:600}.pl-box .pl-bad{color:#b3261e;font-weight:600}
.pl-box .pl-msg{min-height:1.3em}.pl-box ul{margin:6px 0 0;padding-left:20px}.pl-box .pl-late{color:#b3261e;font-weight:600}.pl-box small{color:#5b6470}`;
  function panel(el,cfg){
    if(!document.getElementById('pl-css')){const s=document.createElement('style');s.id='pl-css';s.textContent=css;document.head.append(s)}
    const draw=()=>{
      const ok=valid(st.code);const ids=cfg.labIds();const today=new Date().toISOString().slice(0,10);
      const pz=ids.filter(id=>st.prazos[id]).map(id=>`<li>${esc(cfg.labName(id))}: até ${dpt(st.prazos[id])}${st.prazos[id]<today?' <span class="pl-late">(prazo ultrapassado)</span>':''}</li>`).join('');
      el.innerHTML=`<div class="pl-box" role="region" aria-label="Entrega à professora"><h3>Entregar à professora</h3>
<p>Descarreguem o ficheiro de entrega e enviem-no à professora pelo canal combinado (Classroom, Teams ou pen). Podem entregar várias vezes: fica a versão mais recente.</p>
<div class="pl-row"><label for="pl-code"><b>Código de turma</b></label><input id="pl-code" value="${esc(st.code)}" maxlength="7" autocomplete="off" spellcheck="false" placeholder="ABC-DEF"><span id="pl-cs" class="${ok?'pl-ok':st.code?'pl-bad':''}">${ok?'Código válido':st.code?'Código inválido: confirmem com a professora':''}</span></div>
${pz?`<p style="margin-top:10px"><b>Prazos</b></p><ul>${pz}</ul>`:''}
<div class="pl-row"><button id="pl-dl" ${ok?'':'disabled'}>Descarregar ficheiro de entrega</button><span class="pl-msg" id="pl-msg"></span></div>
<p><small>O ficheiro tem os vossos nomes, números e o trabalho feito nesta página. Não é enviado para nenhum servidor.</small></p></div>`;
      const inp=el.querySelector('#pl-code');
      inp.oninput=()=>{const v=fmt(inp.value);if(clean(v)!==clean(st.code))st.prazos={};st.code=v;keep();const cs=el.querySelector('#pl-cs');const k=valid(v);cs.className=k?'pl-ok':v?'pl-bad':'';cs.textContent=k?'Código válido':clean(v).length<6?'':'Código inválido: confirmem com a professora';el.querySelector('#pl-dl').disabled=!k;cfg.onCode&&cfg.onCode(st.code)};
      inp.onblur=()=>{inp.value=st.code};
      el.querySelector('#pl-dl').onclick=()=>{const msg=el.querySelector('#pl-msg');const prob=cfg.check?cfg.check():null;if(prob){msg.className='pl-msg pl-bad';msg.textContent=prob;return}
        const b=cfg.build();const body={formato:'proglab-entrega',versao:1,disciplina:cfg.disciplina,plataforma:cfg.plataforma,app:cfg.app,turma:fmt(st.code),equipa:b.equipa,alunos:b.alunos,geradoEm:new Date().toISOString(),labs:b.labs.filter(l=>l.estado!=='por_iniciar'),relatorio:b.relatorio||''};
        if(!body.labs.length){msg.className='pl-msg pl-bad';msg.textContent='Ainda não há trabalho para entregar nesta página.';return}
        const file={...body,selo:seal(body,st.code)};
        const nums=b.alunos.map(a=>a.num).filter(Boolean).join('-').replace(/[^\w-]+/g,'')||'alunos';
        const name=`entrega-${cfg.disciplina}-${cfg.app}-eq${b.equipa}-${nums}-${body.geradoEm.slice(0,10)}.json`;
        try{const u=URL.createObjectURL(new Blob([JSON.stringify(file,null,1)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
          msg.className='pl-msg pl-ok';msg.textContent=`Ficheiro «${name}» criado com ${body.labs.length} laboratório${body.labs.length>1?'s':''}. Enviem-no à professora.`}catch(e){msg.className='pl-msg pl-bad';msg.textContent='O navegador bloqueou a transferência. Experimentem outro navegador.'}};
    };
    draw();return{redraw:draw}}
  /* utilitários para os adaptadores */
  const errs=tx=>(tx||[]).filter(o=>o&&o.e).length;
  const qscore=(n,ans,att)=>{let s=0;for(let j=0;j<n;j++)if(ans[j]===0)s+=att&&att[j]?0.5:1;return n?s/n:0};
  const gen=()=>{const a=new Uint32Array(5);crypto.getRandomValues(a);let s='';a.forEach(x=>s+=ABC[x%32]);return fmt(s+chk(s))};
  return{panel,valid,fmt,gen,clean,cyrb,code:()=>st.code,setCode:c=>{const v=fmt(c);if(clean(v)!==clean(st.code))st.prazos={};st.code=v;keep()},prazos:()=>st.prazos,errs,qscore,seal}
})();

/* ======================= dados e catálogo ======================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SITE='https://profalexandrapsilva-proglab.github.io/LAB_SO/';

/* ======================= cofre cifrado =======================
   Os dados só existem cifrados no navegador (AES-GCM 256, chave derivada da
   palavra-passe com PBKDF2-SHA-256, 600 000 iterações). A chave fica só em memória. */
const VK='proglab-teacher-vault-v1',OLD='proglab-teacher-v1',FK='proglab-teacher-tentativas',ITER=600000,MINPW=12,IDLE=15*60*1000;
const blank=()=>({v:1,turmas:{},entregas:[],fich:{},aval:{},cur:null,cfg:{base:SITE}});
let D=null,KEY=null,saveErr='',chain=Promise.resolve();
const b64=u=>{let s='';u=new Uint8Array(u);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt,it){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(obj,key,salt,it){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return{v:1,kdf:'PBKDF2-SHA-256',it,salt:b64(salt),iv:b64(iv),ct:b64(ct)}}
async function open_(box,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},key,unb64(box.ct));return JSON.parse(new TextDecoder().decode(pt))}
function vault(){try{return JSON.parse(localStorage.getItem(VK)||'null')}catch(e){return null}}
/* ======================= ficheiro sincronizado (OneDrive) =======================
   O cofre cifrado é gravado também num ficheiro escolhido pela professora (por exemplo, na pasta
   OneDrive da escola, que o próprio OneDrive sincroniza). Usa a File System Access API (Edge e Chrome).
   O ficheiro tem o formato das cópias de segurança cifradas: sem a palavra-passe ninguém o lê. */
const OD=(()=>{const DB='proglab-teacher-ficheiros',STO='h';
  const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STO);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const get=async k=>{try{const db=await idb();return await new Promise(r=>{const q=db.transaction(STO).objectStore(STO).get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}};
  const put=async(k,v)=>{try{const db=await idb();await new Promise(r=>{const t=db.transaction(STO,'readwrite');v==null?t.objectStore(STO).delete(k):t.objectStore(STO).put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}};
  const ok='showSaveFilePicker' in window&&'showDirectoryPicker' in window&&window.self===window.top;
  const st={file:null,dir:null,estado:'',quando:null,erro:''};
  const perm=async(h,mode,ask)=>{if(!h)return false;const o={mode};try{if(await h.queryPermission(o)==='granted')return true;if(!ask)return false;return(await h.requestPermission(o))==='granted'}catch(e){return false}};
  const wrap=box=>JSON.stringify({formato:'proglab-teacher-backup-cifrada',versao:1,criadoEm:box.em||new Date().toISOString(),cofre:box});
  async function write(box){if(!st.file)return;if(!(await perm(st.file,'readwrite',false))){st.estado='pausa';odBanner();return}
    try{const w=await st.file.createWritable();await w.write(wrap(box));await w.close();st.estado='ok';st.quando=new Date();st.erro=''}catch(e){st.estado='erro';st.erro=e&&e.message||''}odBanner()}
  async function read(h){const f=await h.getFile();return JSON.parse(await f.text())}
  const FLAG='proglab-teacher-od-a-abrir';
  return{ok,st,perm,write,read,wrap,load:async()=>{
    /* proteção: se o navegador falhou ao reabrir o atalho da última vez, desliga a ligação em vez de voltar a falhar */
    let crashed=false;try{crashed=localStorage.getItem(FLAG)==='1'}catch(e){}
    if(crashed){st.desligado=true;await put('cofre',null);await put('pasta',null);try{localStorage.removeItem(FLAG)}catch(e){}return}
    try{localStorage.setItem(FLAG,'1')}catch(e){}
    st.file=await get('cofre');st.dir=await get('pasta');
    try{localStorage.removeItem(FLAG)}catch(e){}
    if(st.file)st.estado=(await perm(st.file,'readwrite',false))?'ok':'pausa'},
    setFile:async h=>{st.file=h;await put('cofre',h);st.estado=h?'ok':''},setDir:async h=>{st.dir=h;await put('pasta',h)}}})();
const odReady=OD.ok?OD.load():Promise.resolve();
function odBanner(){const n=$('#odbanner');if(!n)return;const p=KEY&&OD.st.file&&OD.st.estado==='pausa';n.classList.toggle('hide',!p)}
async function odResume(){if(!(await OD.perm(OD.st.file,'readwrite',true))){alert('Sem autorização, o navegador não consegue gravar no ficheiro do OneDrive.');return}const box=vault();if(box)await OD.write(box)}
function save(){if(!D||!KEY)return;const snap=JSON.parse(JSON.stringify(D)),k=KEY.key,salt=KEY.salt,it=KEY.it;
  chain=chain.then(async()=>{const box=await seal(snap,k,salt,it);box.em=new Date().toISOString();OD.write(box);try{localStorage.setItem(VK,JSON.stringify(box));saveErr='';const n=$('#saveerr');n&&n.classList.add('hide')}catch(e){saveErr='O espaço deste navegador está cheio e as últimas alterações não ficaram guardadas. Descarreguem uma cópia de segurança e apaguem turmas antigas.';const n=$('#saveerr');if(n){n.textContent=saveErr;n.classList.remove('hide')}}}).catch(()=>{})}
function fails(){try{return JSON.parse(localStorage.getItem(FK)||'{"n":0,"ate":0}')}catch(e){return{n:0,ate:0}}}
function setFails(f){try{localStorage.setItem(FK,JSON.stringify(f))}catch(e){}}
function pwProblem(pw){if(pw.length<MINPW)return `A palavra-passe tem de ter pelo menos ${MINPW} caracteres.`;if(new Set(pw).size<5)return 'A palavra-passe repete demasiado os mesmos caracteres.';if(/^(.)\1+$/.test(pw)||/^(0123456789|123456789012|abcdefghijkl|qwertyuiop)/i.test(pw))return 'Essa palavra-passe é demasiado previsível.';return null}
let idleT=null;function poke(){if(!KEY)return;clearTimeout(idleT);idleT=setTimeout(()=>lockNow('A área foi bloqueada depois de 15 minutos sem atividade.'),IDLE)}

let lockMsg='';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const pad=n=>String(n).padStart(2,'0');
const nk=n=>String(n??'').trim().replace(/^0+(?=\d)/,'');
const fmtN=n=>n==null||n===''||isNaN(n)?'—':(Math.round(n*10)/10).toString().replace('.',',');
const dt=iso=>{if(!iso)return '—';const d=new Date(iso);return isNaN(d)?esc(iso):d.toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'})};
const dd=s=>s?s.split('-').reverse().join('/'):'—';
const today=()=>new Date().toISOString().slice(0,10);
function catLabs(disc){const c=CAT[disc];return c?c.plataformas.flatMap(p=>p.labs.map(([k,n])=>({k,n,app:p.app,plat:p.nome}))):[]}
function labName(t,k){const c=catLabs(t.disc).find(x=>x.k===k);if(c)return c.n;const e=D.entregas.find(x=>x.turmaId===t.id&&x.lab===k);return e?e.titulo:k}
function assigned(t){return catLabs(t.disc).map(x=>x.k).filter(k=>t.atrib[k])}
function labsInUse(t){const a=assigned(t);if(a.length)return a;const seen=[];catLabs(t.disc).forEach(x=>{if(D.entregas.some(e=>e.turmaId===t.id&&e.lab===x.k))seen.push(x.k)});D.entregas.forEach(e=>{if(e.turmaId===t.id&&!seen.includes(e.lab))seen.push(e.lab)});return seen}
function eqs(t){return Array.from({length:t.nEq},(_,i)=>pad(i+1))}
function eqActive(t){const withA=eqs(t).filter(q=>t.alunos.some(a=>a.eq===q));return withA.length?withA:eqs(t)}
function alunosEq(t,q){return t.alunos.filter(a=>a.eq===q).sort((a,b)=>+a.num-+b.num)}
function versions(t,q,k){return D.entregas.filter(e=>e.turmaId===t.id&&e.eq===q&&e.lab===k).sort((a,b)=>b.geradoEm.localeCompare(a.geradoEm))}
const AK=(t,q,k)=>t.id+'|'+q+'|'+k;
function auto(e){const c=e.dados.componentes||[];if(!c.length)return null;return Math.round(c.reduce((s,x)=>s+Math.max(0,Math.min(1,+x.valor||0)),0)/c.length*200)/10}
function late(t,e){const p=t.atrib[e.lab]&&t.atrib[e.lab].prazo;return !!(p&&e.geradoEm.slice(0,10)>p)}
function notaAluno(t,q,k,num){const a=D.aval[AK(t,q,k)];if(!a)return null;const v=a.ind&&a.ind[nk(num)];return v!=null&&v!==''?+v:a.nota}
function state(t,q,k){const v=versions(t,q,k),e=v[0],a=D.aval[AK(t,q,k)],p=t.atrib[k]&&t.atrib[k].prazo;
  if(!e)return p&&today()>p?{k:'atraso',txt:'Em atraso',c:'p-bad'}:{k:'pendente',txt:'Pendente',c:'p-mut'};
  if(a&&a.entregaId===e.id)return{k:'avaliado',txt:'Avaliado',c:'p-ok',e,a};
  if(a)return{k:'reentregue',txt:'Nova versão por rever',c:'p-warn',e,a};
  return{k:'avaliar',txt:e.dados.estado==='concluido'?'Por avaliar':'Por avaliar · incompleto',c:e.dados.estado==='concluido'?'p-info':'p-warn',e}}

function noCrypto(){$('#main').innerHTML='<div class="lock"><h1>Navegador sem cifra</h1><p>Esta área precisa de cifrar os dados e só funciona num endereço https:// num navegador atual (Chrome, Edge, Firefox ou Safari).</p></div>'}
function lock(){$('#tabs').innerHTML='';$('#disc').innerHTML='';$('#tsel').classList.add('hide');$('#lockbtn').classList.add('hide');
  const box=vault(),f=fails(),wait=Math.max(0,Math.ceil((f.ate-Date.now())/1000));
  if(!box){$('#main').innerHTML=`<div class="lock"><h1>Criar cofre da professora</h1><p class="small">Os dados desta área ficam cifrados neste navegador. Escolham uma palavra-passe forte, com pelo menos ${MINPW} caracteres (por exemplo, quatro palavras ao acaso). <b>Sem ela não é possível recuperar os dados</b>: guardem-na num gestor de palavras-passe.</p>
<form id="lk"><div class="fld"><label for="pw1">Palavra-passe</label><input id="pw1" type="password" autocomplete="new-password" required minlength="${MINPW}"></div><div class="fld"><label for="pw2">Repetir palavra-passe</label><input id="pw2" type="password" autocomplete="new-password" required></div><button>Criar cofre</button> <span id="lkm" class="small" role="status"></span></form>${OD.ok?`<hr style="margin:20px 0;border:0;border-top:1px solid var(--line)"><h2>Já tem um cofre no OneDrive?</h2><p class="small">Noutro computador, abram o ficheiro do cofre que está na pasta OneDrive. Depois entram com a palavra-passe desse cofre.</p><button type="button" class="sec" id="odopen">Abrir cofre do OneDrive</button> <span id="odm" class="small" role="status"></span>`:''}</div>`;
  const oo=$('#odopen');if(oo)oo.onclick=async()=>{try{const[h]=await showOpenFilePicker({types:[{description:'Cofre ProgLab Teacher',accept:{'application/json':['.json']}}]});const j=await OD.read(h);
    if(!j||j.formato!=='proglab-teacher-backup-cifrada'||!j.cofre||!j.cofre.ct){$('#odm').textContent='Este ficheiro não é um cofre da ProgLab Teacher.';return}
    localStorage.setItem(VK,JSON.stringify(j.cofre));await OD.setFile(h);OD.st.estado=(await OD.perm(h,'readwrite',true))?'ok':'pausa';lock()}catch(x){if(x&&x.name!=='AbortError')$('#odm').textContent='Não foi possível abrir o ficheiro.'}};
    $('#pw1').focus();$('#lk').onsubmit=async e=>{e.preventDefault();const a=$('#pw1').value,b=$('#pw2').value,pr=pwProblem(a);if(pr){$('#lkm').textContent=pr;return}if(a!==b){$('#lkm').textContent='As palavras-passe não coincidem.';return}
      $('#lkm').textContent='A criar o cofre…';const salt=crypto.getRandomValues(new Uint8Array(16));KEY={key:await derive(a,salt,ITER),salt,it:ITER};
      D=blank();let old=null;try{old=JSON.parse(localStorage.getItem(OLD)||'null')}catch(x){}if(old&&old.turmas){D=Object.assign(blank(),old);delete D.cfg.pin}
      save();await chain;if(vault()){try{localStorage.removeItem(OLD)}catch(x){}}sessionStorage.removeItem('proglab-unlock');poke();location.hash=Object.keys(D.turmas).length?'painel':'nova';route()};return}
  $('#main').innerHTML=`<div class="lock"><h1>Área da professora</h1>${lockMsg?`<p class="note info">${esc(lockMsg)}</p>`:''}<p class="small">Introduzam a palavra-passe do cofre.</p>
<form id="lk"><div class="fld"><label for="pw">Palavra-passe</label><input id="pw" type="password" autocomplete="current-password" required></div><button id="lkb"${wait?' disabled':''}>Abrir</button> <span id="lkm" class="small" role="status">${wait?`Demasiadas tentativas: esperem ${wait} s.`:''}</span></form>
<details style="margin-top:18px"><summary class="small" style="cursor:pointer">Esqueci-me da palavra-passe</summary><p class="small">Não há forma de recuperar os dados sem a palavra-passe. Podem apagar o cofre deste navegador e começar de novo; se tiverem uma cópia de segurança, restaurem-na depois com a palavra-passe dessa cópia.</p><button type="button" class="dng" id="nuke">Apagar o cofre deste navegador</button></details></div>`;
  if(wait)setTimeout(()=>{if(!KEY)lock()},wait*1000);

    let use=box;try{await odReady;if(OD.st.file&&await OD.perm(OD.st.file,'readwrite',true)){OD.st.estado='ok';const j=await OD.read(OD.st.file);if(j&&j.cofre&&j.cofre.ct&&(j.cofre.em||j.criadoEm||'')>(box.em||'')){use=j.cofre;localStorage.setItem(VK,JSON.stringify(use))}}}catch(x){}

async function restoreFile(e,msg){const f=e.target.files[0];e.target.value='';if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(x){msg.textContent='Este ficheiro não é uma cópia de segurança do ProgLab Teacher.';return}

  if(j&&j.formato==='proglab-teacher-backup-cifrada'&&j.cofre){const pw=prompt('Palavra-passe com que esta cópia foi feita:');if(pw==null)return;msg.textContent='A abrir a cópia…';try{data=await open_(j.cofre,await derive(pw,unb64(j.cofre.salt),j.cofre.it||ITER))}catch(x){msg.textContent='Palavra-passe errada para esta cópia.';return}}
  else if(j&&j.formato==='proglab-teacher-backup'&&j.dados&&j.dados.turmas)data=j.dados;
  if(!data||!data.turmas){msg.textContent='Este ficheiro não é uma cópia de segurança do ProgLab Teacher.';return}
  if(Object.keys(D.turmas).length&&!confirm('Restaurar esta cópia substitui todos os dados atuais desta área. Continuar?'))return;
  D=Object.assign(blank(),data);D.cfg=Object.assign({base:SITE},D.cfg||{});delete D.cfg.pin;save();location.hash='painel';route()}

<div class="g2"><form class="card" id="nf"><h2>Criar turma</h2>
<div class="fld"><label for="nn">Nome da turma</label><input id="nn" required placeholder="Ex.: 10.º TDS · 2026/27"></div>
<div class="fld"><label for="nd">Disciplina</label><select id="nd">${Object.entries(CAT).map(([k,c])=>`<option value="${k}"${c.brevemente?' disabled':''}>${esc(c.nome)}${c.brevemente?' (brevemente)':''}</option>`).join('')}</select></div>
<div class="fld"><label for="ne">Número de equipas</label><input id="ne" type="number" min="1" max="40" value="8" style="max-width:8em"><span class="small">SO Lab: cada par é uma equipa com o seu cenário (01 a 08). Programação: se o trabalho for individual, cada aluno é uma equipa (até 40).</span></div>
<button>Criar turma</button>${first?'':' <a href="#painel" class="small">Cancelar</a>'}</form>
<div class="card"><h2>Experimentar primeiro</h2><p>Carreguem uma turma de demonstração com 16 alunos fictícios, 8 equipas e entregas já feitas, para verem o painel, a correção e a pauta a funcionar.</p><button class="sec" id="demo">Carregar dados de demonstração</button><p class="small">Podem apagá-la depois em «Turma e equipas».</p>
<h2 style="margin-top:22px">Restaurar uma cópia de segurança</h2><p class="small">Se já usaram esta área noutro computador, restaurem aqui a cópia (cifrada) que descarregaram.</p><label class="sec" style="display:inline-block;border:1.5px solid var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:650">Escolher cópia<input type="file" id="rs0" accept=".json" class="hide"></label><p id="rm0" class="small" role="status"></p></div></div>`}
function bindNew(){$('#nf').onsubmit=e=>{e.preventDefault();const t={id:uid(),nome:$('#nn').value.trim(),disc:$('#nd').value,code:PL.gen(),nEq:Math.max(1,Math.min(40,+$('#ne').value||8)),alunos:[],atrib:{},criadoEm:new Date().toISOString()};D.turmas[t.id]=t;D.cur=t.id;save();location.hash='turma'};
  $('#demo').onclick=()=>{demo();location.hash='painel';route()};$('#rs0').onchange=e=>restoreFile(e,$('#rm0'))}

/* ======================= painel ======================= */
function viewPainel(m){const t=T(),L=labsInUse(t),Q=eqActive(t),a=assigned(t);
  let ent=0;const per=Q.map(q=>{const d=L.filter(k=>versions(t,q,k).length).length;ent+=d;return[q,d]});
  const notas=[];Q.forEach(q=>L.forEach(k=>{const s=D.aval[AK(t,q,k)];if(s&&s.nota!=null)notas.push(+s.nota)}));
  const autos=[];Q.forEach(q=>L.forEach(k=>{const v=versions(t,q,k)[0];if(v){const x=auto(v);if(x!=null)autos.push(x)}}));
  const avg=x=>x.length?x.reduce((s,y)=>s+y,0)/x.length:null;
  const tot=Q.length*L.length;
  const latestRows=[];Q.forEach(q=>L.forEach(k=>{const s=state(t,q,k);latestRows.push({q,k,s,when:s.e?s.e.recebidoEm:''})}));
  const recent=latestRows.filter(r=>r.s.e).sort((x,y)=>y.when.localeCompare(x.when)).slice(0,8);
  const falta=latestRows.filter(r=>!r.s.e&&a.includes(r.k)).sort((x,y)=>(x.s.k==='atraso'?0:1)-(y.s.k==='atraso'?0:1)||x.q.localeCompare(y.q)).slice(0,8);
  const porAval=latestRows.filter(r=>r.s.k==='avaliar'||r.s.k==='reentregue').length;
  m.innerHTML=`<h1>${esc(t.nome)}</h1><p class="lead">${esc(CAT[t.disc]?.nome||t.disc)} · código de turma <b class="mono">${esc(t.code)}</b>${a.length?` · ${a.length} laboratório${a.length>1?'s':''} atribuído${a.length>1?'s':''}`:' · ainda sem laboratórios atribuídos'}</p>
${!t.alunos.length?`<div class="note">Ainda não há alunos nesta turma. <a href="#turma">Registem os alunos e as equipas</a> para que as entregas sejam associadas a cada aluno.</div>`:''}
${!a.length?`<div class="note info">Escolham os laboratórios e os prazos em <a href="#laboratorios">Laboratórios e prazos</a>. Até lá, o painel conta os laboratórios que já foram entregues.</div>`:''}
<div class="kpis">
 <div class="kpi"><div class="l">Alunos registados</div><div class="v">${t.alunos.length}</div></div>
 <div class="kpi"><div class="l">Equipas</div><div class="v">${Q.length}</div></div>
 <div class="kpi"><div class="l">Laboratórios entregues</div><div class="v">${ent}/${tot}</div><div class="s">${porAval} por avaliar</div></div>
 <div class="kpi"><div class="l">Classificação média</div><div class="v">${fmtN(avg(notas))}</div><div class="s">${notas.length?`${notas.length} ${notas.length>1?'avaliações':'avaliação'} · `:''}automática ${fmtN(avg(autos))}</div></div>
</div>
<div class="g2"><div class="card"><h2>Progresso por equipa</h2>${L.length?per.map(([q,d])=>{const p=Math.round(d/L.length*100);return `<div class="bar"><a href="#entregas/${q}">Equipa ${q}</a><div class="t" role="img" aria-label="${p}%"><i class="${p===100?'full':''}" style="width:${p}%"></i></div><b>${p}%</b></div>`}).join(''):'<p class="small">Sem laboratórios atribuídos nem entregas.</p>'}</div>
<div class="card"><h2>Entregas recentes</h2>${recent.length?`<div class="tw"><table><thead><tr><th>Equipa</th><th>Laboratório</th><th class="n">Nota</th><th>Estado</th></tr></thead><tbody>${recent.map(r=>`<tr class="click" data-go="entrega/${r.s.e.id}"><td>${r.q}</td><td>${esc(labName(t,r.k))}</td><td class="n">${r.s.a?fmtN(r.s.a.nota)+'/20':'—'}</td><td><span class="pill ${r.s.c}">${r.s.txt}</span>${late(t,r.s.e)?' <span class="pill p-bad">fora do prazo</span>':''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small">Ainda não foram importadas entregas. <a href="#entregas">Importar ficheiros</a>.</p>'}
${falta.length?`<h3>Em falta</h3><div class="tw"><table><tbody>${falta.map(r=>`<tr><td>${r.q}</td><td>${esc(labName(t,r.k))}</td><td>até ${dd(t.atrib[r.k].prazo)}</td><td><span class="pill ${r.s.c}">${r.s.txt}</span></td></tr>`).join('')}</tbody></table></div>`:''}</div></div>`;
  m.querySelectorAll('[data-go]').forEach(r=>r.onclick=()=>location.hash=r.dataset.go)}

const VER=(()=>{let fr=null,ready=null,seq=0;const wait=new Map();
  function boot(){if(ready)return ready;ready=new Promise((res,rej)=>{fr=document.createElement('iframe');fr.setAttribute('sandbox','allow-scripts');fr.setAttribute('aria-hidden','true');fr.tabIndex=-1;fr.style.cssText='position:absolute;width:0;height:0;border:0;visibility:hidden';
    const eng=document.getElementById('lab-engine').textContent;
    fr.srcdoc='<!DOCTYPE html><meta charset="utf-8"><script>'+eng+'\naddEventListener("message",function(e){var m=e.data||{},out;try{var r=Lab.check(m.src,m.lang,m.tests,m.files);out={id:m.id,compileError:r.compileError||null,line:r.line||null,results:(r.results||[]).map(function(x){return{input:x.input,expected:x.expected,got:x.got,pass:x.pass,error:x.error}})}}catch(x){out={id:m.id,compileError:"erro interno do verificador",results:[]}}parent.postMessage(out,"*")});parent.postMessage({pronto:1},"*")<\/script>';
    const t=setTimeout(()=>rej(new Error('o verificador não arrancou')),10000);
    addEventListener('message',e=>{if(!fr||e.source!==fr.contentWindow)return;const d=e.data||{};if(d.pronto){clearTimeout(t);res();return}const w=wait.get(d.id);if(w){wait.delete(d.id);w(d)}});
    document.body.append(fr)});return ready}
  async function run(src,lang,tests,files){await boot();const id=++seq;return new Promise(res=>{const t=setTimeout(()=>{wait.delete(id);res({id,compileError:'o programa demorou demasiado a correr',results:[]})},8000);wait.set(id,d=>{clearTimeout(t);res(d)});fr.contentWindow.postMessage({id,src,lang,tests,files},'*')})}
  return{run}})();
async function verifyCPP(l){const C=CHK(),by={};
  l.respostas.forEach(r=>{const m=r.p.match(/^(.*?) · programa da etapa Criar \((.*)\)$/);if(m)by[m[1]]={code:r.r,claimed:/^passou nos testes/.test(m[2])}});
  const items=[];
  for(const ms of l.missoes){const title=ms.t.split(': criar um programa para ')[0],c=C[title],r=by[title];
    if(!c){items.push({t:title,estado:'desconhecido',declarado:ms.ok});continue}
    if(!r||!String(r.code).trim()){items.push({t:title,estado:ms.ok?'sem_codigo':'por_fazer',declarado:ms.ok});continue}
    let res;try{res=await VER.run(r.code,c.l,c.v.concat(c.h),c.f)}catch(x){items.push({t:title,estado:'nao_verificado',declarado:ms.ok,erro:String(x.message||x)});continue}

async function importFiles(files){const out=[];
  for(const f of files){
    if(f.size>3e6){out.push(['bad',f.name,'Ficheiro demasiado grande (máx. 3 MB).']);continue}
    let j;try{j=JSON.parse(await f.text())}catch(e){out.push(['bad',f.name,'Não é um ficheiro de entrega válido (JSON ilegível).']);continue}
    if(!j||j.formato!=='proglab-entrega'){out.push(['bad',f.name,/^proglab-teacher-backup/.test(j&&j.formato||'')?'Isto é uma cópia de segurança: restaurem-na em «Dados e privacidade».':'Não é um ficheiro de entrega ProgLab.']);continue}
    const t=Object.values(D.turmas).find(x=>PL.clean(x.code)===PL.clean(j.turma));
    if(!t){out.push(['bad',f.name,`O código de turma «${esc(S(j.turma,12))}» não corresponde a nenhuma turma desta área.`]);continue}
    if(j.disciplina!==t.disc){out.push(['bad',f.name,`A entrega é de ${esc(S(j.disciplina,10))}, mas a turma «${esc(t.nome)}» é de ${esc(t.disc)}.`]);continue}
    const {selo,...body}=j;const seloOk=PL.seal(body,j.turma)===selo;
    const alunos=A(j.alunos,4).map(a=>({num:nk(S(a&&a.num,10)),nome:S(a&&a.nome,80)}));
    const hit=alunos.map(a=>t.alunos.find(r=>nk(r.num)===a.num)).filter(Boolean);
    const eqR=[...new Set(hit.map(r=>r.eq).filter(Boolean))];
    let eq=eqR.length===1?eqR[0]:null;const fe=/^\d{1,2}$/.test(S(j.equipa,4))?pad(+j.equipa):'';const warn=[];
    if(eqR.length>1)warn.push(`os alunos estão registados em equipas diferentes (${eqR.join(' e ')}); usada a equipa ${eqR[0]}`),eq=eqR[0];
    if(!eq){if(fe&&+fe<=t.nEq){eq=fe;if(t.alunos.length)warn.push('alunos não encontrados na turma: usada a equipa indicada no ficheiro')}else{out.push(['bad',f.name,'Não foi possível identificar a equipa: registem os números destes alunos em «Turma e equipas».']);continue}}
    else if(fe&&fe!==eq)warn.push(`o ficheiro indica a equipa ${fe}, a turma regista a equipa ${eq}`);
    if(hit.length<alunos.filter(a=>a.num).length&&eqR.length)warn.push('um dos números não está registado na turma');
    if(!seloOk)warn.push('selo inválido: o ficheiro foi alterado depois de descarregado');
    const fid=uid();let n=0,dup=0;
    for(const l0 of A(j.labs,40)){const l=cleanLab(l0||{});if(!l.id||l.estado==='por_iniciar')continue;
      const g=S(j.geradoEm,40);if(D.entregas.some(e=>e.turmaId===t.id&&e.eq===eq&&e.lab===l.id&&e.geradoEm===g)){dup++;continue}
      const lw=warn.slice();let verif=null;if(j.disciplina==='CPP'&&l.missoes.length){verif=await verifyCPP(l);applyVerif(l,verif,lw);lw.forEach(w=>{if(!warn.includes(w)&&w.startsWith(l.titulo))warn.push(w)})}
      D.entregas.push({id:uid(),turmaId:t.id,eq,lab:l.id,app:S(j.app,20),plataforma:S(j.plataforma,60),titulo:l.titulo||l.id,recebidoEm:new Date().toISOString(),geradoEm:g,ficheiro:S(f.name,160),fid,alunos,seloOk,avisos:lw,dados:l,verif});n++}
    if(n)D.fich[fid]={relatorio:S(j.relatorio,200000)};
    out.push([n?(warn.length?'warn':'ok'):'warn',f.name,`${esc(t.nome)} · equipa ${eq}: ${n} laboratório${n!==1?'s':''} importado${n!==1?'s':''}${dup?`, ${dup} já existia${dup>1?'m':''}`:''}${warn.length?' · Atenção: '+esc(warn.join('; ')):''}`]);
  }
  save();return out}

/* xlsx mínimo, sem bibliotecas: ZIP sem compressão com SpreadsheetML */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}})();
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;

    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nb,db);const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,db.length,true);c.setUint32(24,db.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);cd.push(c.buffer,nb);off+=30+nb.length+db.length});
  const cdl=cd.reduce((s,b)=>s+(b.byteLength??b.length),0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdl,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e.buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],

<ul><li>Se limparem os dados do navegador, perdem tudo o que não tiver cópia de segurança. Para não depender deste computador, liguem a área a um ficheiro no OneDrive (abaixo).</li><li>Usem esta área no vosso computador pessoal ou numa conta só vossa, não num computador partilhado da escola. Bloqueiem a área sempre que se afastarem.</li><li>Não usem o modo de navegação privada: ao fechar a janela, o cofre é apagado.</li><li>Os ficheiros de entrega dos alunos têm nomes e números: guardem-nos e apaguem-nos segundo as regras da escola.</li><li>Ocupação atual (cifrada): ${(used/1024).toFixed(0)} KB (o navegador costuma permitir cerca de 5 000 KB).</li></ul></div>
<div class="card" id="odcard"><h2>Guardar no OneDrive da escola</h2>${OD.ok?`<p>Liguem a área a um ficheiro dentro da pasta <b>OneDrive</b> do computador. Cada alteração passa a ser gravada nesse ficheiro e o OneDrive sincroniza-o: ficam com uma cópia sempre atualizada e podem abrir o cofre noutro computador («Abrir cofre do OneDrive», no ecrã de entrada). O ficheiro vai <b>cifrado</b> com a palavra-passe do cofre e ocupa poucos KB.</p>
${OD.st.desligado&&!OD.st.file?'<div class="note bad">O navegador não conseguiu reabrir o ficheiro do OneDrive e a ligação foi desligada por segurança. Os dados deste navegador estão intactos: liguem de novo ao mesmo ficheiro.</div>':''}<p>${OD.st.file?`Ligado ao ficheiro <b class="mono">${esc(OD.st.file.name)}</b> · ${OD.st.estado==='ok'?(OD.st.quando?'última gravação às '+OD.st.quando.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}):'pronto a gravar'):OD.st.estado==='pausa'?'<span class="pill p-warn">em pausa</span>':'<span class="pill p-bad">erro ao gravar</span> '+esc(OD.st.erro)}`:'<span class="pill p-mut">Ainda não ligado</span>'}</p>
<div class="row"><button type="button" id="odlink">${OD.st.file?'Escolher outro ficheiro':'Ligar a um ficheiro no OneDrive'}</button>${OD.st.file&&OD.st.estado!=='ok'?'<button type="button" class="sec" id="odres2">Retomar a gravação</button>':''}${OD.st.file?'<button type="button" class="lnk" id="odoff">Desligar</button>':''}</div>
<p class="small">Na janela que se abre, escolham a pasta OneDrive (por exemplo «OneDrive - Escola › ProgLab») e mantenham o nome sugerido. Depois de recarregarem a página, o navegador volta a pedir autorização para gravar.</p>`:'<p class="small">Esta função precisa do Microsoft Edge ou do Google Chrome no computador. Neste navegador, usem as cópias de segurança abaixo e guardem-nas na pasta OneDrive.</p>'}</div>
<div class="g2"><div class="card"><h2>Cópia de segurança</h2><p>Descarreguem uma cópia no fim de cada período de entregas. A cópia fica <b>cifrada com a palavra-passe atual</b>: para a restaurar, é precisa essa palavra-passe.</p><div class="row"><button id="bk">Descarregar cópia de segurança</button><label class="sec" style="border:1.5px solid var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:650">Restaurar cópia<input type="file" id="rs" accept=".json" class="hide"></label></div><p id="bm" class="small" role="status"></p></div>
<div class="card"><h2>Segurança do cofre</h2><ul><li>Os dados estão cifrados (AES-256) com a vossa palavra-passe. Sem ela ninguém os consegue ler, nem vocês.</li><li>A área bloqueia ao fim de 15 minutos sem atividade, ao recarregar a página e no botão «Bloquear».</li><li>Depois de 5 tentativas erradas, a entrada fica suspensa durante algum tempo.</li><li>A página não comunica com nenhum servidor: a política de segurança do navegador bloqueia qualquer envio de dados.</li></ul>
<form id="cpf"><h3>Mudar a palavra-passe</h3><div class="fld"><label for="cp0">Palavra-passe atual</label><input id="cp0" type="password" autocomplete="current-password" required></div><div class="fld"><label for="cp1">Nova palavra-passe</label><input id="cp1" type="password" autocomplete="new-password" required minlength="12"></div><div class="fld"><label for="cp2">Repetir a nova</label><input id="cp2" type="password" autocomplete="new-password" required></div><button>Mudar a palavra-passe</button> <span id="pm" class="small" role="status"></span></form></div></div>
<div class="card"><h2>Antes de usar com alunos</h2><p>Os alunos são menores. Mesmo sem servidor, esta área trata dados pessoais (nomes, números e trabalho dos alunos). Antes de começarem:</p><ol><li>Informem a direção e o encarregado de proteção de dados da escola de como a área funciona.</li><li>Recolham só o necessário: o número basta para identificar; o nome é opcional nos ficheiros dos alunos.</li><li>Definam onde ficam os ficheiros de entrega e durante quanto tempo, e apaguem-nos no fim do ano letivo.</li><li>Se no futuro ligarem a área a um servidor (Supabase ou Firebase), isso exige autorização da escola, servidores na União Europeia, um contrato de tratamento de dados e informação aos encarregados de educação.</li></ol><p class="small">Esta lista é uma orientação prática e não substitui o parecer do encarregado de proteção de dados da escola.</p></div>
<div class="card"><h2>Endereço do SO Lab</h2><p class="small">Usado nas ligações para os alunos.</p><form class="row" id="bf"><input id="base" value="${esc(D.cfg.base)}" style="flex:1;min-width:280px" class="mono" aria-label="Endereço do SO Lab"><button>Guardar</button></form></div>
<div class="card"><h2>Apagar tudo</h2><p>Apaga todas as turmas, entregas e avaliações deste navegador.</p><button class="dng" id="wipe">Apagar todos os dados</button></div>`;
  const odl=$('#odlink');if(odl)odl.onclick=async()=>{try{const h=await showSaveFilePicker({suggestedName:'ProgLab-Teacher-cofre.json',types:[{description:'Cofre ProgLab Teacher',accept:{'application/json':['.json']}}]});await OD.setFile(h);const box=vault();if(box)await OD.write(box);viewDados(m)}catch(x){if(x&&x.name!=='AbortError')alert('Não foi possível ligar ao ficheiro.')}};
  const odr2=$('#odres2');if(odr2)odr2.onclick=async()=>{await odResume();viewDados(m)};
  const odo=$('#odoff');if(odo)odo.onclick=async()=>{await OD.setFile(null);viewDados(m)};
  $('#bk').onclick=async()=>{const box=await seal(D,KEY.key,KEY.salt,KEY.it);const b=new Blob([JSON.stringify({formato:'proglab-teacher-backup-cifrada',versao:1,criadoEm:new Date().toISOString(),cofre:box})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`proglab-teacher-copia-cifrada-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);$('#bm').textContent='Cópia cifrada descarregada.'};
  $('#rs').onchange=e=>restoreFile(e,$('#bm'));
  $('#cpf').onsubmit=async e=>{e.preventDefault();const p0=$('#cp0').value,p1=$('#cp1').value,p2=$('#cp2').value;
    try{await open_(vault(),await derive(p0,KEY.salt,KEY.it))}catch(x){$('#pm').textContent='A palavra-passe atual está errada.';return}
    const pr=pwProblem(p1);if(pr){$('#pm').textContent=pr;return}if(p1!==p2){$('#pm').textContent='As novas palavras-passe não coincidem.';return}
    $('#pm').textContent='A cifrar com a nova palavra-passe…';const salt=crypto.getRandomValues(new Uint8Array(16));KEY={key:await derive(p1,salt,ITER),salt,it:ITER};save();await chain;$('#pm').textContent='Palavra-passe alterada. As cópias antigas continuam a abrir com a palavra-passe antiga.';$$('#cpf input').forEach(i=>i.value='')};
  $('#bf').onsubmit=e=>{e.preventDefault();D.cfg.base=$('#base').value.trim()||SITE;save();route()};
  $('#wipe').onclick=()=>{const b=$('#wipe');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Confirmar: apagar todos os dados';return}D=blank();save();location.hash='nova';route()}}
